<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @keyframes ko-leaf-flutter {
      0%, 100% { transform: rotate(-20deg) skewX(0deg); }
      28%      { transform: rotate(-10deg) skewX(-5deg); }
      52%      { transform: rotate(-24deg) skewX(3deg); }
      78%      { transform: rotate(-14deg) skewX(-2deg); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .ko-leaf-fl { animation: ko-leaf-flutter 3.6s ease-in-out infinite; }
    }
  </style>
</helmet>
<div style="position:relative; width:100%; height:100%; container-type:size; display:flex; align-items:center; justify-content:center; filter:drop-shadow(0 6px 14px rgba(120,80,10,.18));">
  <div style="position:absolute; top:-3%; left:47%; width:7%; height:24%; background:linear-gradient(#7a5418,#9c7126); border-radius:42%; transform:rotate(13deg); transform-origin:bottom center;"></div>
  <div class="ko-leaf {{ leafClass }}" style="position:absolute; top:1%; left:56%; width:32%; height:19%; background:linear-gradient(135deg,#ecc757,#caa033); border-radius:0 100% 0 100%; transform:rotate(-20deg); transform-origin:2% 98%; box-shadow:inset 0 -2px 4px rgba(120,80,10,.2);"></div>
  <div style="position:absolute; inset:9% 4% 2% 4%; background:radial-gradient(118% 120% at 33% 24%, #f3d883 0%, #e6b73f 36%, #cc9420 74%, #a9761a 100%); border-radius:48% 48% 47% 47% / 45% 45% 56% 56%; box-shadow:inset 0 -7% 12% rgba(110,72,8,.28), inset 0 4% 8% rgba(255,245,210,.45);"></div>
  <div style="position:absolute; inset:16% 12% 11% 12%; background:radial-gradient(100% 100% at 50% 38%, #fdf5da, #f1e1b6); border-radius:48% 48% 47% 47% / 45% 45% 56% 56%; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 0 0 1px rgba(180,140,40,.18);">
    <span style="font-family:'JetBrains Mono','Courier New',monospace; font-weight:700; font-size:44cqmin; line-height:1; color:#b07d12; transform:translateY(-3%);">&#955;</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;flutter&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const f = this.props.flutter === true || this.props.flutter === 'true';
    return { leafClass: f ? 'ko-leaf-fl' : '' };
  }
}
</script>
</body>
</html>
