# Just for the record, TOML is the quite possibly the worst
# configuration file format that has ever existed. I loathe
# it, I loathe those who pushed it into the Python packaging
# limelight, and I hope I can one day completely rewrite this
# in a Koskari DSL.


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "koskari-kosrunner"
version = "0.1.0"
description = "Asyncio cron job scheduler in Koskari"
authors = [
    {name = "Christopher O'Brien", email = "obriencj@gmail.com"},
]
license = {text = "GNU General Public License v3"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "koskari",
    "aiocron",
    "aiosqlite",
    "fastapi",
    "jinja2",
    "python-multipart",
    "uvicorn",
]


# The broker varieties are extras: their client libraries are heavy (and
# stompman's own floor is 3.11), so a definition that never declares a
# kafka or umb job need not carry them. The variety modules themselves stay
# importable regardless -- each resolves its client in the job constructor
# via require-extra, which names the extra to install when it is missing.
[project.optional-dependencies]
kafka = ["aiokafka"]
umb = ["stompman"]
all = ["aiokafka", "stompman"]

[project.urls]
Homepage = "https://github.com/obriencj/koskari/"


[tool.setuptools]
packages = ["kosrunner"]


[tool.setuptools.package-data]
kosrunner = ["*.ki", "templates/*.html"]


# The end.
