worker_processes 1;
events { worker_connections 256; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 8080;

        # Inbound webhooks stay OPEN -- no auth. These are the triggers
        # other systems POST to. (A future per-job trigger UUID would be
        # the minimal bearer-style guard for this surface.)
        location /webhook/ {
            proxy_pass http://kosrunner:8080;
        }

        # Everything else -- the web UI (/ui) and the admin JSON API
        # (/admin) -- sits behind basic auth. Splitting view from control
        # (read-only UI open, mutations gated) is a future refinement;
        # for now the whole control surface is gated as one.
        location / {
            auth_basic           "kosrunner";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://kosrunner:8080;
        }
    }
}
