[tox]
envlist = py

[testenv]
; both broker varieties are extras; the suite covers them, so it takes them
extras =
    kafka
    umb
deps =
    -e ../..
    httpx
commands =
    python -m unittest tests.job_config tests.memwatch tests.watch_task tests.webhook_token tests.webhook_async tests.webhook_input tests.webhook_access tests.webhook_surface tests.webhook_readback tests.umb_config tests.umb_dispatch tests.extras {posargs}

# The end.
