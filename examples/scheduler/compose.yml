# kosrunner demo stack: the scheduler behind an nginx basic-auth frontend.
#
#   podman compose up --build
#   # browse http://localhost:8080/ui   (prompts for auth)
#   # curl  -X POST http://localhost:8080/webhook/ping -d '{}'   (open)
#
# DEMO ONLY. The basic-auth credentials default to ADMIN / ADMIN -- these
# are OBVIOUS PLACEHOLDERS, not a real secret (the htpasswd hash is
# generated at container start from the env vars below; nothing sensitive
# is committed). Override before exposing this anywhere:
#
#   KOSRUNNER_USER=you KOSRUNNER_PASS=$(openssl rand -hex 16) podman compose up
#
# Requires the koskari:local base image (see the repo Makefile) that the
# Containerfile builds FROM.

services:

  kosrunner:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      # run history lives on the volume below (the PVC stand-in)
      KOSRUNNER_STORAGE_ROOT: /var/lib/kosrunner
    volumes:
      - runs:/var/lib/kosrunner
    # not published to the host -- only nginx reaches it, over the
    # compose network on the internal port
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    depends_on:
      - kosrunner
    environment:
      # DEMO DEFAULTS -- override these. Plaintext placeholders, not creds.
      KOSRUNNER_USER: ${KOSRUNNER_USER:-ADMIN}
      KOSRUNNER_PASS: ${KOSRUNNER_PASS:-ADMIN}
    ports:
      - "8080:8080"
    volumes:
      # `:z` relabels for SELinux hosts (RHEL/Fedora); a harmless no-op
      # elsewhere. Without it, an enforcing host denies the mounts.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./nginx/10-htpasswd.sh:/docker-entrypoint.d/10-htpasswd.sh:ro,z

volumes:
  runs:
