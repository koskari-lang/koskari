# Build koskari runtime image (root Containerfile) and push to GHCR.
# Invoke via workflow_call, workflow_dispatch, or from release pipelines.

name: Deploy container

on:
  workflow_call:
    inputs:
      image-tag:
        description: Tag for the container image (defaults to version report)
        required: false
        type: string
  workflow_dispatch:
    inputs:
      image-tag:
        description: Tag for the container image (defaults to version report)
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version metadata
        id: version
        run: |
          eval "$(python3 -B tools/regen_version.py --report)"
          echo "commit=$KOSKARI_COMMIT" >> "$GITHUB_OUTPUT"
          echo "dirty=$KOSKARI_DIRTY" >> "$GITHUB_OUTPUT"
          echo "exact_tag=$KOSKARI_EXACT_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$KOSKARI_VERSION" >> "$GITHUB_OUTPUT"
          tag="${{ inputs.image-tag }}"
          if [ -z "$tag" ]; then
            tag="$(python3 -B tools/regen_version.py --report tag)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          build-args: |
            KOSKARI_COMMIT=${{ steps.version.outputs.commit }}
            KOSKARI_DIRTY=${{ steps.version.outputs.dirty }}
            KOSKARI_EXACT_TAG=${{ steps.version.outputs.exact_tag }}
            KOSKARI_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
