# Build the baked-in corpus MCP Lambda image and redeploy it.
#
# Pure "do it" workflow: no change detection here. It is invoked by the
# master pipeline (ci-master.yml) when something MCP-relevant changed,
# and can be dispatched by hand to force a rebuild and redeploy (for
# example to pick up a new koskari base image).
#
# The image builds FROM the published GHCR koskari runtime image; local
# builds of the same Containerfile default to koskari:local instead.
#
# Because the dataset is baked into the image, a corpus change and a server
# change take the identical path -- both are just a new image. Authenticates
# to AWS via GitHub OIDC (no long-lived keys), mirroring the Hugging Face
# Trusted-Publishers pattern in publish_corpus_dataset.yml.
#
# Prerequisites (one-time, see tools/mcp/deploy/README.md and
# design/mcp-baked-in-lambda.md Part 4): ECR repo, the Lambda function and
# HTTP API stood up (the SAM template), and an IAM role trusting this repo's
# OIDC subject with ECR push + lambda:UpdateFunctionCode. Provide the role
# ARN as the AWS_MCP_DEPLOY_ROLE repository variable/secret.

name: Deploy MCP Lambda

on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: koskari-mcp
  FUNCTION_NAME: koskari-mcp
  PLATFORM: linux/arm64

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: aws-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Install tox
        run: pip install tox

      - name: Export all corpus views to parquet
        run: tox -qe regen-corpus -- --all-views

      - name: Stage parquet into the MCP build context
        run: |
          rm -rf tools/mcp/data
          mkdir -p tools/mcp/data
          cp -R build/corpus/datasets/. tools/mcp/data/

      - name: Resolve version metadata
        id: version
        run: |
          eval "$(python3 -B tools/regen_version.py --report)"
          echo "commit=$KOSKARI_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Resolve base image
        id: base
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR (pull the koskari base)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_MCP_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Lambda image (arm64)
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          tag="${{ steps.version.outputs.commit }}"
          repo="$REGISTRY/$ECR_REPOSITORY"
          docker build --platform "$PLATFORM" \
            -t "$repo:$tag" -t "$repo:latest" \
            --build-arg KOSKARI_BASE="${{ steps.base.outputs.image }}" \
            -f tools/mcp/Containerfile.lambda tools/mcp/
          docker push "$repo:$tag"
          docker push "$repo:latest"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$repo:$tag")"
          echo "image=$digest" >> "$GITHUB_OUTPUT"

      - name: Update the Lambda function
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "${{ steps.build.outputs.image }}"
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"


# The end.
