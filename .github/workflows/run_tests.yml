# Reusable test workflow for koskari.
# Invoke via workflow_call, workflow_dispatch, or from ci-*.yml triggers.
#
# Linux jobs use the official python:*-bookworm images (buildpack-deps:
# gcc, git, headers, and a non-distro pip already present).

name: Run tests

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: run-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: self-hosted
    container:
      image: docker.io/library/python:3.12-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tox
        run: python -m pip install --disable-pip-version-check tox tox-uv

      - name: Flake8
        run: tox -qe flake8

  test:
    needs: lint
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    container:
      image: docker.io/library/python:${{ matrix.python-version }}-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tox
        run: python -m pip install --disable-pip-version-check tox tox-uv

      - name: Unit tests (phased)
        run: tox -qe test
