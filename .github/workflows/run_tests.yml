# Reusable test workflow for koskari.
# Invoke via workflow_call, workflow_dispatch, or from ci-*.yml triggers.
# Jobs run on the `runner` input, defaulting to GitHub-hosted; only the
# push and release callers pass self-hosted, so a pull request from a
# fork never reaches the maintainer's runner.
#
# Linux jobs use the official python:*-bookworm images (buildpack-deps:
# git, headers, and a non-distro pip already present). The evaluator
# threads dispatch through musttail, so the test job adds clang and lld;
# the image's gcc predates musttail.

name: Run tests

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for every job
        type: string
        default: ubuntu-latest
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label for every job
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest

concurrency:
  group: run-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ${{ inputs.runner }}
    container:
      image: docker.io/library/python:3.12-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tox
        run: python -m pip install --disable-pip-version-check tox tox-uv

      - name: Flake8
        run: tox -qe flake8

  test:
    needs: lint
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    container:
      image: docker.io/library/python:${{ matrix.python-version }}-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install clang and lld
        run: |
          apt-get update -qq
          apt-get install -qy --no-install-recommends clang lld

      - name: Install tox
        run: python -m pip install --disable-pip-version-check tox tox-uv

      - name: Unit tests (phased)
        run: tox -qe test
