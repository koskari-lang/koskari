# Export corpus dataset views to parquet and publish to Hugging Face.
# Manual trigger only; not wired into main CI.
#
# Publish authenticates via Hugging Face Trusted Publishers (OIDC). Configure
# the publisher on obriencj/koskari dataset settings with repository
# obriencj/koskari and workflow publish_corpus_dataset.yml.

name: Publish corpus dataset

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Export only; skip Hugging Face upload
        required: false
        default: false
        type: boolean

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Install tox
        run: pip install tox

      - name: Export all corpus views to parquet
        run: tox -qe regen-corpus -- --all-views

      - name: Upload parquet artifact
        uses: actions/upload-artifact@v7
        with:
          name: corpus-datasets
          path: build/corpus/datasets/

  publish:
    runs-on: ubuntu-latest
    needs: export
    if: ${{ !inputs.dry_run }}

    permissions:
      id-token: write
      contents: read

    environment:
      name: huggingface
      url: https://huggingface.co/datasets/obriencj/koskari

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download parquet artifact
        uses: actions/download-artifact@v7
        with:
          name: corpus-datasets
          path: build/corpus/datasets/

      - name: Install Hugging Face CLI
        run: pip install "huggingface_hub[cli]>=1.19.0"

      - name: Publish parquet to Hugging Face Hub
        env:
          HF_OIDC_RESOURCE: datasets/obriencj/koskari
        run: |
          hf upload obriencj/koskari build/corpus/datasets . \
            --repo-type dataset

      - name: Publish dataset card
        env:
          HF_OIDC_RESOURCE: datasets/obriencj/koskari
        run: |
          hf upload obriencj/koskari tools/corpus/dataset_card.md README.md \
            --repo-type dataset


  # The end.
