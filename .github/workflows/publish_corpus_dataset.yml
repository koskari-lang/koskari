# Export corpus dataset views to parquet and publish to Hugging Face.
# Invoked by the master pipeline (ci-master.yml) when corpus-relevant
# content changed, or dispatched by hand.
#
# Publish authenticates via Hugging Face Trusted Publishers (OIDC). Configure
# the publisher on obriencj/koskari dataset settings with repository
# obriencj/koskari; when invoked via workflow_call the OIDC token's
# workflow_ref names the calling workflow, so the publisher list needs an
# entry for ci-master.yml alongside publish_corpus_dataset.yml.

name: Publish corpus dataset

on:
  workflow_call:
    inputs:
      dry_run:
        description: Export only; skip Hugging Face upload
        required: false
        default: false
        type: boolean
      dataset_artifact:
        description: >-
          Name of a parquet artifact already uploaded in this workflow
          run; when set, the export job is skipped and the publish job
          downloads this artifact instead
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      dry_run:
        description: Export only; skip Hugging Face upload
        required: false
        default: false
        type: boolean

jobs:
  export:
    runs-on: self-hosted
    container:
      image: docker.io/library/python:3.14-bookworm
    if: ${{ inputs.dataset_artifact == '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tox
        run: python -m pip install --disable-pip-version-check tox tox-uv

      # The export is Koskari, so regen-corpus installs the package and
      # builds the C extension; it is no longer a pure-Python job.
      - name: Export all corpus views to parquet
        run: tox -qe regen-corpus -- --all-views

      - name: Upload parquet artifact
        uses: actions/upload-artifact@v7
        with:
          name: corpus-datasets
          path: build/corpus/datasets/

  publish:
    runs-on: self-hosted
    container:
      image: docker.io/library/python:3.14-bookworm
    needs: export
    if: |
      !cancelled()
      && !inputs.dry_run
      && (needs.export.result == 'success' || needs.export.result == 'skipped')

    permissions:
      id-token: write
      contents: read

    environment:
      name: huggingface
      url: https://huggingface.co/datasets/koskari/koskari

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download parquet artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.dataset_artifact || 'corpus-datasets' }}
          path: build/corpus/datasets/

      - name: Install Hugging Face CLI
        run: python -m pip install --disable-pip-version-check "huggingface_hub[cli]>=1.19.0"

      - name: Publish parquet to Hugging Face Hub
        env:
          HF_OIDC_RESOURCE: datasets/koskari/koskari
        run: |
          hf upload koskari/koskari build/corpus/datasets . \
            --repo-type dataset

      - name: Publish dataset card
        env:
          HF_OIDC_RESOURCE: datasets/koskari/koskari
        run: |
          hf upload koskari/koskari tools/corpus/dataset_card.md README.md \
            --repo-type dataset


  # The end.
