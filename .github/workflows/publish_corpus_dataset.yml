# Export corpus dataset views to parquet and (future) publish to Hugging Face.
# Manual trigger only; not wired into main CI.

name: Publish corpus dataset

on:
  workflow_dispatch:
    inputs:
      view:
        description: Corpus dataset view name
        required: false
        default: koskari-eval
        type: string

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Install tox
        run: pip install tox

      - name: Export corpus view to parquet
        run: tox -qe regen-corpus -- --view "${{ inputs.view }}"

      - name: Upload parquet artifact
        uses: actions/upload-artifact@v4
        with:
          name: corpus-dataset-${{ inputs.view }}
          path: build/corpus/datasets/

  publish:
    runs-on: ubuntu-latest
    needs: export
    if: false
    steps:
      # Future: download artifact, install huggingface_hub, upload parquet
      # to a Hub dataset repo using secrets.HF_TOKEN and a configured repo id.
      - name: Publish to Hugging Face Hub
        run: echo "publish stub; enable job when HF_TOKEN and repo are configured"


  # The end.
