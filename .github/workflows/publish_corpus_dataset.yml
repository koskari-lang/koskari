# Export corpus dataset views to parquet and publish to Hugging Face.
# Manual trigger only; not wired into main CI.
#
# Publish authenticates via Hugging Face Trusted Publishers (OIDC). Configure
# the publisher on obriencj/koskari dataset settings with repository
# obriencj/koskari and workflow publish_corpus_dataset.yml.

name: Publish corpus dataset

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Export only; skip Hugging Face upload
        required: false
        default: false
        type: boolean

jobs:
  export:
    runs-on: self-hosted
    container:
      image: docker.io/library/ubuntu:24.04
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Install tox
        run: pip install tox

      # The export is Koskari, so regen-corpus installs the package and
      # builds the C extension; it is no longer a pure-Python job.
      - name: Export all corpus views to parquet
        run: tox -qe regen-corpus -- --all-views

      - name: Upload parquet artifact
        uses: actions/upload-artifact@v7
        with:
          name: corpus-datasets
          path: build/corpus/datasets/

  publish:
    runs-on: self-hosted
    container:
      image: docker.io/library/ubuntu:24.04
    needs: export
    if: ${{ !inputs.dry_run }}

    permissions:
      id-token: write
      contents: read

    environment:
      name: huggingface
      url: https://huggingface.co/datasets/koskari/koskari

    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Download parquet artifact
        uses: actions/download-artifact@v8
        with:
          name: corpus-datasets
          path: build/corpus/datasets/

      - name: Install Hugging Face CLI
        run: python -m pip install --disable-pip-version-check "huggingface_hub[cli]>=1.19.0"

      - name: Publish parquet to Hugging Face Hub
        env:
          HF_OIDC_RESOURCE: datasets/koskari/koskari
        run: |
          hf upload koskari/koskari build/corpus/datasets . \
            --repo-type dataset

      - name: Publish dataset card
        env:
          HF_OIDC_RESOURCE: datasets/koskari/koskari
        run: |
          hf upload koskari/koskari tools/corpus/dataset_card.md README.md \
            --repo-type dataset


  # The end.
