# Build PyPI-uploadable distributions: sdist plus cibuildwheel wheels.
#
# Linux wheels must carry manylinux/musllinux tags to be accepted by
# PyPI, so cibuildwheel drives the builds inside the blessed images and
# audits the results; macOS wheels are tagged by deployment target and
# need no repair. Coverage: CPython 3.9-3.14 on manylinux + musllinux
# x86_64 and aarch64 (native runners, no QEMU), and macOS arm64 plus
# cross-compiled x86_64.
#
# The Pyodide wheel is an experimental target with its own job: it builds
# for one Python, runs the full test suite as the only 32-bit coverage
# in CI, and a failure leaves that week's snapshot without the wheel
# rather than holding back the others. Its settings live in
# tools/cibuildwheel-pyodide.toml, shared with the pyodide tox environment.
#
# The optional version input stamps a PEP 440 version into setup.cfg
# before building, which is how publish_pypi.yml injects snapshot (.devN)
# and release versions; without it, distributions carry the setup.cfg
# version as committed.

name: "Build: Wheel"

on:
  workflow_call:
    inputs:
      version:
        description: >-
          PEP 440 version to stamp into setup.cfg before building; empty
          builds the committed version
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: >-
          PEP 440 version to stamp into setup.cfg before building; empty
          builds the committed version
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stamp version into setup.cfg
        if: ${{ inputs.version != '' }}
        run: sed -i "s/^version = .*/version = ${{ inputs.version }}/" setup.cfg

      - name: Install build
        run: python -m pip install --disable-pip-version-check build

      - name: Build sdist
        run: python -B -m build --sdist .

      - name: Store sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            archs: x86_64
          - runner: ubuntu-24.04-arm
            archs: aarch64
          - runner: macos-latest
            archs: arm64 x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stamp version into setup.cfg
        if: ${{ inputs.version != '' }}
        run: sed -i.bak "s/^version = .*/version = ${{ inputs.version }}/" setup.cfg

      # The evaluator threads dispatch through musttail, so the Linux
      # images (manylinux: dnf; musllinux: apk) get clang and lld before
      # building, and CC selects clang. macOS builds with Apple clang.
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3
        env:
          CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_BEFORE_ALL_LINUX: >-
            (command -v dnf && dnf install -y clang lld)
            || (command -v apk && apk add clang lld)
          CIBW_ENVIRONMENT_LINUX: CC=clang
          CIBW_TEST_COMMAND: python -c "import koskari"
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Store wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.runner }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-pyodide:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stamp version into setup.cfg
        if: ${{ inputs.version != '' }}
        run: sed -i "s/^version = .*/version = ${{ inputs.version }}/" setup.cfg

      - name: Build and test the Pyodide wheel
        uses: pypa/cibuildwheel@v4.3
        with:
          only: cp314-pyodide_wasm32
          config-file: tools/cibuildwheel-pyodide.toml

      - name: Store wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-pyodide
          path: wheelhouse/*.whl
          if-no-files-found: error

# The end.
