name: "Build: Wheel"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-wheel-linux:
    runs-on: self-hosted
    container:
      image: docker.io/library/ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --disable-pip-version-check build

      - name: Generate Wheel
        run: |
          python -B -m build .

      - name: Store Wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  build-wheel-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --disable-pip-version-check build

      - name: Generate Wheel
        run: |
          python -B -m build .

      - name: Store Wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-macos-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error


# The end.
