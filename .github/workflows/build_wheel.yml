name: "Build: Wheel"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Install Dependencies
        run: |
          python -m pip install --disable-pip-version-check build

      - name: Generate Wheel
        run: |
          python -B -m build .

      - name: Store Wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error


# The end.
