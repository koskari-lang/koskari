name: "Deploy Documentation"

on:
  workflow_call:
  workflow_dispatch:

jobs:

  build-documentation:
    runs-on: self-hosted
    container:
      image: docker.io/library/python:3.14-bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: python -m pip install --disable-pip-version-check tox tox-uv

      - name: Generate Site
        run: tox -qe site

      - name: Store Site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy-documentation:
    runs-on: self-hosted
    container:
      image: docker.io/library/python:3.14-bookworm

    needs:
      - build-documentation

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy site
        id: deploy
        uses: actions/deploy-pages@v5


  # The end.
