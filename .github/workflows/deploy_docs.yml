name: "Deploy Documentation"

on:
  workflow_call:
  workflow_dispatch:

jobs:

  build-documentation:
    runs-on: self-hosted
    container:
      image: docker.io/library/ubuntu:24.04

    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Install Dependencies
        run: |
          pip install tox

      - name: Generate Site
        run: |
          tox -qe site

      - name: Store Site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy-documentation:
    runs-on: self-hosted
    container:
      image: docker.io/library/ubuntu:24.04

    needs:
      - build-documentation

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy site
        id: deploy
        uses: actions/deploy-pages@v5


  # The end.
