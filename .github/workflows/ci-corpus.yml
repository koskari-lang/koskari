# Corpus PR gate: when a pull request changes only corpus records, run
# just the corpus phase.
#
# ci-pull-request.yml fires only on tests/** and koskari/** changes, so a
# corpus-only PR would otherwise get no CI; this is its lightweight gate.
# Mixed PRs that also touch tests/koskari still get the full suite (which
# already includes phase_corpus). Pushes to master are covered by the
# ci-master.yml pipeline, which always runs the full suite, so there is
# no push trigger here.

name: CI corpus

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - docs/corpus/**

jobs:
  corpus:
    uses: ./.github/workflows/run_corpus.yml
