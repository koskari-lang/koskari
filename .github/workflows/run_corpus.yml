# Reusable corpus-conformance workflow for koskari.
# Runs only the corpus phase (phase_corpus): every corpus YAML record is
# checked against the real read/expand/eval pipeline. Invoke via
# workflow_call, workflow_dispatch, or from ci-corpus.yml. The job runs
# on a GitHub-hosted runner.

name: Run corpus tests

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: run-corpus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.12-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install clang and lld
        run: |
          apt-get update -qq
          apt-get install -qy --no-install-recommends clang lld

      - name: Install tox
        run: python -m pip install --disable-pip-version-check tox tox-uv

      - name: Corpus conformance (phase_corpus)
        run: tox -qe py -- -m phase_corpus
