# Reusable corpus-conformance workflow for koskari.
# Runs only the corpus phase (phase_corpus): every corpus YAML record is
# checked against the real read/expand/eval pipeline. Invoke via
# workflow_call, workflow_dispatch, or from ci-corpus.yml.

name: Run corpus tests

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: run-corpus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    runs-on: self-hosted
    container:
      image: docker.io/library/ubuntu:24.04
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install tox
        run: python -m pip install --disable-pip-version-check tox

      - name: Corpus conformance (phase_corpus)
        run: tox -qe py -- -m phase_corpus
