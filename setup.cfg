[metadata]
name = koskari
version = 0.1.0
description = Koskari: A LISP dialect for Python
author = Christopher O'Brien
# O'Brien breaks a lot of tools.
author_email = obriencj@gmail.com

license = GNU General Public License v3 (GPLv3)
license_files =
  LICENSE

long_description = file: README.md
long_description_content_type = text/markdown

classifiers =
  Development Status :: 2 - Pre-Alpha
  Intended Audience :: Developers
  Programming Language :: Python :: 3
  Programming Language :: Python :: 3.9
  Programming Language :: Python :: 3.10
  Programming Language :: Python :: 3.11
  Programming Language :: Python :: 3.12
  Programming Language :: Python :: 3.13
  Programming Language :: Python :: 3.14
  Programming Language :: Python :: Implementation :: CPython
  Topic :: Software Development :: Interpreters


[options]
py_modules =
  koskari_importer
packages =
  koskari
  koskari.help
  koskari.bootstrap
  koskari.lib
  koskari.reader
  koskari.reader.layouts
  koskari.lexer
  koskari.lexer.prompt_toolkit
  koskari.lexer.lsp
  koskari.compile
  koskari.compile.pragma
  koskari.compile.specials
  koskari.serialize
python_requires = >=3.9
include_package_data = False
zip_safe = False


[options.extras_require]
prompt_toolkit =
  prompt_toolkit>=3.0

lsp =
  pygls>=2.0
  lsprotocol


[options.data_files]
koskari =
  koskari.pth


[options.package_data]
koskari =
  *.ki
koskari.bootstrap = *.ki


[options.entry_points]
console_scripts =
  koskari = koskari.cli:main
  koskari-lsp = koskari.lexer.lsp:main


[tox:tox]
envlist = flake8,test
isolated_build = True
skip_missing_interpreters = True


[testenv]
description = Run unit tests with pytest
deps =
  pytest
  pytest-cov
extras =
  prompt_toolkit
  lsp
commands =
  python -BI -m pytest {posargs:-v tests/}
setenv =
  PYTHONFAULTHANDLER=1
  PYTHONSAFEPATH=1
passenv =
  KOS_TRACE_FREELIST
  KOS_TRACE_EVENTS
  KOS_TRACE_TIMING
  KOS_TRACE_EVAL_SYNC
  VERBOSE_DEBUG
  DEBUG


[testenv:test]
commands =
  python -BI tools/pyphase.py


[testenv:gdb]
description = Run unit tests with pytest under gdb
allowlist_externals =
    gdb
commands =
    gdb -batch -ex run -ex "bt full" -ex quit \
       --args {envpython} -BI -m pytest --import-mode=importlib \
       {posargs:-v -s tests/}
setenv =
  PYTHONFAULTHANDLER=1
  VERBOSE_DEBUG=1
  DEBUG=1


[testenv:lldb]
description = Run unit tests with pytest under lldb
allowlist_externals =
    lldb
commands =
    lldb --file {envpython} \
      --batch \
      -o run \
      -o continue \
      -o bt \
      -o quit \
      -- -BI -m pytest --import-mode=importlib \
      {posargs:-v -s tests/}
setenv =
  PYTHONFAULTHANDLER=1
  VERBOSE_DEBUG=1
  DEBUG=1


[testenv:churn-trace]
description = Build with tracing enabled, run examples/churn, print trace JSON
commands =
  python -B examples/churn/churn.py
setenv =
  KOS_TRACE_EVENTS=1
  KOS_TRACE_TIMING=1
  KOS_TRACE_FREELIST=1
  KOS_TRACE_EVAL_SYNC=1
  PYTHONFAULTHANDLER=1


[testenv:flake8]
description = Run flake8 linting
basepython = python3
skip_install = True
deps =
  flake8
commands =
  flake8 koskari/


[testenv:mypy]
description = Run mypy type checking
basepython = python3
deps =
  mypy
commands =
  mypy koskari/ {posargs}


[testenv:handlers]
description = Regenerate handlers.incl from opcodes.incl
skip_install = True
commands =
  python -B tools/opimpl.py


[testenv:regen-editors]
description = Regenerate editor syntax-highlighting assets from YAML + Jinja2
skip_install = True
deps =
  jinja2
  PyYAML
commands =
  python -B tools/editor-tokens/regen_editors_assets.py {posargs}


[testenv:build]
description = Build wheel using uv
basepython = python3
skip_install = True
allowlist_externals =
  uv
commands =
  uv build --wheel


[tool:pytest]
# this prevents pytest from trying to run directly from the source dir,
# which causes it to fail to find the extension module
addopts = --import-mode=importlib
# strict_markers = true
# markers for the pytest-phase plugin, this defines the ordering
markers =
    phase_lib: Phase 1 - lib, types, opcode
    phase_infra: Phase 2 - matcher, reader, lexer, dis
    phase_compile: Phase 3 - compile helpers, syntax, bytecode
    phase_specials: Phase 4 - compile specials
    phase_importer: Phase 5 - importer
    phase_basics: Phase 6 - koskari-written basics.ki
    phase_cli: Phase 7 - CLI
    phase_reproducers: Phase 8 - full-stack scenarios
# pygls uses deprecated asyncio.iscoroutinefunction
filterwarnings =
    ignore:.*asyncio\.iscoroutinefunction.*:DeprecationWarning:pygls.*


[flake8]
max-line-length = 100
exclude =
  .tox,
  .git,
  __pycache__,
  build,
  dist,
  *.egg-info,
  .eggs
ignore =
  E501, E203, E303
  W503


[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
exclude = tests


# The end.
