[metadata]
name = koskari
version = 0.1.0
description = Koskari: A LISP dialect for Python - playground language for joyful expression
author = Christopher O'Brien
# O'Brien breaks a lot of tools.
author_email = obriencj@gmail.com

license = GNU General Public License v3 (GPLv3)
license_files =
  LICENSE

long_description = file: README.md
long_description_content_type = text/markdown

classifiers =
  Development Status :: 2 - Pre-Alpha
  Intended Audience :: Developers
  Programming Language :: Python :: 3
  Programming Language :: Python :: 3.9
  Programming Language :: Python :: 3.10
  Programming Language :: Python :: 3.11
  Programming Language :: Python :: 3.12
  Programming Language :: Python :: 3.13
  Programming Language :: Python :: 3.14
  Programming Language :: Python :: Implementation :: CPython
  Topic :: Software Development :: Interpreters


[options]
packages =
  koskari
  koskari.importer
  koskari.lib
  koskari.reader
  koskari.reader.layouts
  koskari.lexer
  koskari.lexer.prompt_toolkit
  koskari.compile
  koskari.compile.specials
python_requires = >=3.9
include_package_data = False
zip_safe = False


[options.extras_require]
prompt_toolkit = prompt_toolkit>=3.0


[options.package_data]
koskari = *.ki


[options.entry_points]
console_scripts =
  koskari = koskari.cli:main


[tox:tox]
envlist = py{39,310,311,312,313,314}, prompt-toolkit, flake8, mypy
isolated_build = True
skip_missing_interpreters = True


[testenv]
description = Run unit tests with pytest
deps =
  pytest
  pytest-cov
commands =
  python -BI -m pytest {posargs:-v tests/}
setenv =
  PYTHONFAULTHANDLER=1
  PYTHONSAFEPATH=1
passenv =
  KOS_TRACE_FREELIST
  KOS_TRACE_INTERN
  KOS_TRACE_EVENTS
  KOS_TRACE_TIMING
  VERBOSE_DEBUG
  DEBUG


[testenv:prompt-toolkit]
description = Run tests including prompt_toolkit integration
extras = prompt_toolkit
deps =
  pytest
  pytest-cov
commands =
  python -BI -m pytest tests/lexer/prompt_toolkit/ -v
setenv =
  PYTHONFAULTHANDLER=1
  PYTHONSAFEPATH=1
passenv =
  KOS_TRACE_FREELIST
  KOS_TRACE_INTERN
  KOS_TRACE_EVENTS
  KOS_TRACE_TIMING
  VERBOSE_DEBUG
  DEBUG


[testenv:gdb]
description = Run unit tests with pytest under gdb
allowlist_externals =
    gdb
commands =
    gdb -batch -ex run -ex "bt full" -ex quit \
       --args {envpython} -BI -m pytest --import-mode=importlib \
       {posargs:-v -s tests/}
setenv =
  PYTHONFAULTHANDLER=1
  VERBOSE_DEBUG=1
  DEBUG=1


[testenv:flake8]
description = Run flake8 linting
basepython = python3
skip_install = True
deps =
  flake8
commands =
  flake8 koskari/


[testenv:mypy]
description = Run mypy type checking
basepython = python3
deps =
  mypy
commands =
  mypy koskari/ {posargs}


[testenv:handlers]
description = Regenerate handlers.incl from opcodes.incl
basepython = python3
skip_install = True
commands =
  python tools/opimpl.py


[testenv:build]
description = Build wheel using uv
basepython = python3
skip_install = True
allowlist_externals =
  uv
commands =
  uv build --wheel


[tool:pytest]
# this prevents pytest from trying to run directly from the source dir,
# which causes it to fail to find the extension module
addopts = --import-mode=importlib


[flake8]
max-line-length = 100
exclude =
  .tox,
  .git,
  __pycache__,
  build,
  dist,
  *.egg-info,
  .eggs
ignore =
  E501, E203, E303
  W503


[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
exclude = tests


# The end.
