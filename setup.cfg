[metadata]
name = koskari
version = 0.1.0
description = Koskari: A LISP dialect for Python - playground language for joyful expression
author = Christopher O'Brien
# O'Brien breaks a lot of tools.
author_email = obriencj@gmail.com

license = GNU General Public License v3 (GPLv3)
license_files =
    LICENSE

long_description = file: README.md
long_description_content_type = text/markdown

classifiers =
    Development Status :: 2 - Pre-Alpha
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: Implementation :: CPython
    Topic :: Software Development :: Interpreters


[options]
packages = find:
package_dir =
    = .
python_requires = >=3.9
include_package_data = True
zip_safe = False


[options.package_data]
koskari = *.ki


[options.entry_points]
console_scripts =
    koskari = koskari.cli:main


[tox:tox]
envlist = py{39,310,311,312}, flake8, mypy
isolated_build = True
skip_missing_interpreters = True


[testenv]
description = Run unit tests with pytest
deps =
    setuptools
    pytest
    pytest-cov
commands =
    pytest {posargs:-v -s tests/}


[testenv:flake8]
description = Run flake8 linting
basepython = python3
skip_install = True
deps =
    flake8
commands =
    flake8 koskari/


[testenv:mypy]
description = Run mypy type checking
basepython = python3
deps =
    mypy
commands =
    mypy koskari/ {posargs}


[testenv:build]
description = Build wheel using uv
basepython = python3
skip_install = True
allowlist_externals =
    uv
commands =
    uv build --wheel


[tool:pytest]
# this prevents pytest from trying to run directly from the source dir,
# which causes it to fail to find the extension module
addopts = --import-mode=importlib


[flake8]
max-line-length = 100
exclude =
    .tox,
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    .eggs
ignore =
    # line too long (handled by formatter)
    E501,
    # whitespace before ':'
    E203


[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
exclude = tests


# The end.
