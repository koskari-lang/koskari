[metadata]
name = koskari
version = 0.1.0
description = Koskari: A LISP dialect for Python
author = Christopher O'Brien
# O'Brien breaks a lot of tools.
author_email = obriencj@gmail.com

copyright_years = 2025-2026

license = GNU General Public License v3 (GPLv3)
license_files =
  LICENSE

long_description = file: README.md
long_description_content_type = text/markdown

classifiers =
  Development Status :: 2 - Pre-Alpha
  Intended Audience :: Developers
  Programming Language :: Python :: 3
  Programming Language :: Python :: 3.9
  Programming Language :: Python :: 3.10
  Programming Language :: Python :: 3.11
  Programming Language :: Python :: 3.12
  Programming Language :: Python :: 3.13
  Programming Language :: Python :: 3.14
  Programming Language :: Python :: Implementation :: CPython
  Topic :: Software Development :: Interpreters


[options]
packages =
  koskari
  koskari.assets
  koskari.bootstrap
  koskari.cli
  koskari.compile
  koskari.compile.pragma
  koskari.compile.specials
  koskari.fences
  koskari.help
  koskari.lexer
  koskari.lexer.prompt_toolkit
  koskari.extras.pygments
  koskari.extras.lsp
  koskari.extras.setuptools
  koskari.extras.sphinx
  koskari.lib
  koskari.reader
  koskari.reader.layouts
  koskari.serialize

python_requires = >=3.9
include_package_data = False
zip_safe = False


[options.extras_require]
repl =
  prompt_toolkit>=3.0

lsp =
  pygls>=2.0
  lsprotocol

pygments =
  pygments>=2.0

sphinx =
  sphinx>=7.0
  pygments>=2.0


[options.package_data]
koskari = *.ki
koskari.assets =
  *.ki
  *.svg
  *.png
koskari.bootstrap = *.ki
koskari.cli = *.ki
koskari.extras.sphinx = static/*.css
koskari.help = *.ki


[options.entry_points]
setuptools.finalize_distribution_options =
  koskari_scripts = koskari.extras.setuptools.plugin:configure_koskari_scripts
console_scripts =
  koskari = koskari.cli:main
  koskari-lsp = koskari.extras.lsp:main

pygments.lexers =
  koskari = koskari.extras.pygments:KoskariLexer


[tox:tox]
envlist = flake8,test
isolated_build = True
skip_missing_interpreters = True
# Use uv for env create/install. virtualenv's embedded pip seed has been
# leaving a pip package without __main__ in CI tox envs (python -I -m pip
# then fails). tox-uv installs with uv pip instead.
requires =
  tox-uv >= 1.25


[testenv]
deps =
  pytest
  pytest-cov
  pyarrow
  jsonschema
  PyYAML
  setuptools
  pydantic
  # mcp 2.x is 3.10+ only; the reproducer that drives tools/mcp skips
  # itself on 3.9 to match
  mcp; python_version >= "3.10"
extras =
  repl
  lsp
  pygments
  sphinx
commands =
  python -BI -m pytest {posargs:-v tests/}
setenv =
  PYTHONFAULTHANDLER=1
  PYTHONSAFEPATH=1
passenv =
  CC
  KOS_TRACE_FREELIST
  KOS_TRACE_EVENTS
  KOS_TRACE_OPCACHE
  KOS_TRACE_TIMING
  KOS_TRACE_EVAL_SYNC
  KOS_STACK_TRACE
  KOS_DEBUG_PATCH_DYN_CACHES
  KOS_EVAL_SAFETYNET
  KOS_NOFREELIST
  KOS_ALL_COLD
  KOS_ASAN
  VERBOSE_DEBUG
  DEBUG


[testenv:test]
description = Run unit tests in phase order
commands =
  python -BI tools/pyphase.py {posargs}


[testenv:asan]
description = Run unit tests in phase order with an ASan-instrumented extension
setenv =
  PYTHONFAULTHANDLER=1
  PYTHONSAFEPATH=1
  PYTHONMALLOC=malloc
passenv =
  CC
  KOS_ASAN
  KOS_EVAL_SAFETYNET
  KOS_NOFREELIST
  KOS_DEBUG_PATCH_DYN_CACHES
  LD_PRELOAD
  ASAN_OPTIONS
# -I would imply -E and discard PYTHONMALLOC, leaving pymalloc's
# arenas between the sanitizer and every PyMem allocation
commands =
  python -B -s -P tools/pyphase.py {posargs}


[testenv:valgrind]
description = Run unit tests in phase order under Valgrind
allowlist_externals =
    valgrind
setenv =
  PYTHONFAULTHANDLER=1
  PYTHONSAFEPATH=1
  PYTHONMALLOC=malloc
passenv =
  CC
  KOS_EVAL_SAFETYNET
  KOS_NOFREELIST
  KOS_DEBUG_PATCH_DYN_CACHES
  DEBUG
commands =
  valgrind \
    --suppressions={toxinidir}/tests/native/valgrind-python.supp \
    --suppressions={toxinidir}/tools/valgrind/koskari.supp \
    --leak-check=full \
    --show-leak-kinds=definite,indirect \
    --errors-for-leak-kinds=none \
    --error-exitcode=99 \
    {envpython} -B -s -P tools/pyphase.py {posargs}


[testenv:gdb]
description = Run unit tests with pytest under gdb
allowlist_externals =
    gdb
commands =
    gdb -batch -ex run -ex "bt full" -ex quit \
       --args {envpython} -BI -m pytest --import-mode=importlib \
       {posargs:-v -s tests/}
setenv =
  PYTHONFAULTHANDLER=1
  VERBOSE_DEBUG=1
  DEBUG=1


[testenv:lldb]
description = Run unit tests with pytest under lldb
allowlist_externals =
    lldb
commands =
    lldb --file {envpython} \
      --batch \
      -o run \
      -o continue \
      -o bt \
      -o quit \
      -- -BI -m pytest --import-mode=importlib \
      {posargs:-v -s tests/}
setenv =
  PYTHONFAULTHANDLER=1
  VERBOSE_DEBUG=1
  DEBUG=1


[testenv:churn]
description = run examples/churn (Python vs Koskari, answers cross-checked)
extras =
deps =
commands =
  python -B examples/churn/churn.py --mode compare {posargs}
setenv =
  PYTHONSAFEPATH=


[testenv:churn-trace]
description = Build with tracing enabled, run examples/churn Koskari-only, print trace JSON
extras =
deps =
commands =
  python -B examples/churn/churn.py --mode koskari {posargs}
setenv =
  KOS_TRACE_EVENTS=1
  KOS_TRACE_OPCACHE=1
  KOS_TRACE_TIMING=1
  KOS_TRACE_FREELIST=0
  KOS_TRACE_EVAL_SYNC=1
  PYTHONFAULTHANDLER=1
  PYTHONSAFEPATH=


[testenv:churn-timing]
description = Build with opcode timing only, run examples/churn Koskari-only, write trace.json
extras =
deps =
commands =
  python -B examples/churn/churn.py --mode koskari {posargs}
setenv =
  KOS_TRACE_TIMING=1
  PYTHONFAULTHANDLER=1


[testenv:perf]
description = Per-kernel perf counters over churn kernels, appended to design/perf/perf.tsv
extras =
deps =
commands =
  python -B -m koskari tools/perfstat.ki stat {posargs}
setenv =
  PYTHONSAFEPATH=


[testenv:perf-opcodes]
description = Per-opcode cycle shares: a KOS_ALL_COLD build sampled under perf record
extras =
deps =
commands =
  python -B -m koskari tools/perfstat.ki opcodes {posargs}
setenv =
  KOS_ALL_COLD=1
  PYTHONSAFEPATH=


[testenv:opgrams]
description = Opcode n-gram frequency analysis over compiled Koskari code
# The tools group analyses the developer tools themselves, so their
# dependencies have to be importable for the default all-groups run.
extras =
  repl
deps =
  -r tools/requirements.txt
commands =
  python -B -m koskari tools/tools.ki -- opgrams {posargs}
setenv =
  PYTHONSAFEPATH=


[testenv:matchbench]
description = Matcher and match/case micro-benchmarks
# Same dependency posture as opgrams: the tools dispatcher imports the
# corpus export tool while building its parser.
extras =
  repl
deps =
  -r tools/requirements.txt
commands =
  python -B -m koskari tools/tools.ki -- matchbench {posargs}
setenv =
  PYTHONSAFEPATH=


[testenv:opsizing]
description = Per-handler code size joined with per-opcode timing, written beside design/perf/perf.tsv
# Same dependency posture as opgrams.
extras =
  repl
deps =
  -r tools/requirements.txt
commands =
  python -B -m koskari tools/tools.ki -- opsizing {posargs}
setenv =
  PYTHONSAFEPATH=


[testenv:flake8]
description = Run flake8 linting
basepython = python3
skip_install = True
deps =
  flake8
commands =
  flake8 koskari/


[testenv:flawfinder]
description = Run Flawfinder security scan on native C sources
basepython = python3
skip_install = True
deps =
  flawfinder
commands =
  flawfinder --quiet --minlevel=3 --error-level=3 koskari/lib/


[testenv:mypy]
# Do not use. Intended for future self-flagellation only: annotating the
# entirety of koskari is a someday-maybe project, not a working target.
description = Run mypy type checking - unused
basepython = python3
deps =
  mypy
commands =
  mypy koskari/ {posargs}


[testenv:handlers]
description = Regenerate handlers.incl from opcodes.incl
skip_install = True
commands =
  python -B tools/opimpl.py


[testenv:regen-version]
description = Regenerate koskari/_version.py from setup.cfg and git
skip_install = True
deps =
commands =
  python -B tools/regen_version.py {posargs}


[testenv:regen-corpus]
# Not skip_install: the corpus loader is Koskari, so the export needs
# koskari importable to resolve it through the import hook.
description = Export corpus YAML views to parquet
deps =
  pyarrow
  PyYAML
commands =
  python -B -m koskari tools/tools.ki -- corpus {posargs}
setenv =
  PYTHONSAFEPATH=


[testenv:build]
description = Build wheel using uv
basepython = python3
skip_install = True
allowlist_externals =
  uv
commands =
  uv build --wheel


[testenv:sphinx]
description = Build user documentation
extras =
  repl
  lsp
  sphinx
  pygments
deps =
  linkify-it-py
  myst-parser
  sphinx-design
  sphinx_rtd_theme
  sphinxcontrib-mermaid
commands =
  python -B -m sphinx.cmd.build --keep-going -b dirhtml docs build/site/docs {posargs}


[testenv:site]
description = Build the full published site (landing page + docs) into build/site
extras =
  repl
  lsp
  sphinx
  pygments
deps =
  linkify-it-py
  myst-parser
  sphinx-design
  sphinx_rtd_theme
  sphinxcontrib-mermaid
  jinja2
commands =
  python -B -m sphinx.cmd.build --keep-going -b dirhtml docs build/site/docs {posargs}
  python -B tools/build_site.py --out build/site


[tool:pytest]
# this prevents pytest from trying to run directly from the source dir,
# which causes it to fail to find the extension module
addopts = --import-mode=importlib
# strict_markers = true
# markers for the pytest-phase plugin, this defines the ordering
markers =
    phase_lib: Phase 1 - lib, types, opcode
    phase_infra: Phase 2 - matcher, reader, lexer core, dis
    phase_compile: Phase 3 - compile helpers, syntax, bytecode
    phase_specials: Phase 4 - compile specials
    phase_importer: Phase 5 - importer
    phase_basics: Phase 6 - koskari-written basics
    phase_cli: Phase 7 - CLI
    phase_reproducers: Phase 8 - full-stack scenarios
    phase_extras: Phase 9 - extras
    phase_corpus: Phase 10 - corpus conformance
# pygls uses deprecated asyncio.iscoroutinefunction
filterwarnings =
    ignore:.*asyncio\.iscoroutinefunction.*:DeprecationWarning:pygls.*


[flake8]
max-line-length = 100
exclude =
  .tox,
  .git,
  __pycache__,
  build,
  dist,
  docs,
  *.egg-info,
  .eggs
ignore =
  E501, E203, E303
  W503


[isort]
multi_line_output = 4
lines_after_imports = 2
line_length = 79
include_trailing_comma = false
# isort has no include list; skip every other Python-bearing root so
# `isort .` only sees koskari/, tests/, and examples/.
filter_files = true
extend_skip =
  .claude
  docs
  tools
  setup.py


[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
exclude = tests


[egg_info]
# having the egg in the base directory makes it trigger the setuptools
# plugin during builds, when it doesn't properly exist yet, which causes
# errors.
egg_base = .eggs


# The end.
