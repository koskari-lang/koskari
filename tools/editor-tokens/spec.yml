version: 1

# Layout block heads (specialty-defined layouts) that appear as `NAME:` at the
# start of a line. Peer heads are listed separately under layout_peers.
layout_heads:
  - if
  - try
  - begin
  - define
  - when
  - when-main
  - call
  - class
  - for-each
  - while
  - dyn-wind
  - with
  - dyn-with
  - define-class
  - define-syntax
  - syntax-rules
  - macro-rules
  - special-rules
  - syntax-match
  - macro-match
  - special-match
  - define-coroutine

# Peer block heads for layouts that declare peers. These are not necessarily
# special forms, but they do appear as `NAME:` block headers.
layout_peers:
  if:
    - elif
    - else
  try:
    - except
    - else
    - finally

# Literal constants reserved for future editor highlighting. The first
# iteration keeps these in the spec but does not wire them into grammars yet.
constants:
  - "True"
  - "False"
  - "None"
  - "nil"

# Paren-list first-symbol tokens to highlight as keyword.control (TextMate),
# keyword.control (Helix), and font-lock-keyword-face (Emacs). One ordered list
# for all three; adjust order here if you care about alternation precedence.
#
# Entries are short names for compiler specials registered as compile/... (see
# design/SPECIALS.md and koskari/lexer/discovery.py: both the prefixed and
# stripped names resolve for highlighting) plus short names for macros from
# koskari/importer/basics.ki (design/MACROS.md; define-syntax compile/NAME
# registers NAME without the compile/ prefix).
#
# TextMate: editors/textmate/syntaxes/koskari.tmLanguage.json.j2 renders this
# word set into #list-head-special and #bare-line-call-head (same alternation);
# regenerate the JSON after edits.
# Emacs: editors/emacs/koskari-mode.el.j2 uses the same list for paren list-head
# and for implicit layout lines (line-start, optional indent, head word); regenerate
# koskari-mode.el after edits.
# Keep entries aligned when adding or renaming.
list_head_specials:
  - and
  - attr
  - await
  - begin
  - bind!
  - bindq
  - break
  - call/cc
  - capture/cc
  - class
  - cond
  - continue
  - decorate
  - define
  - define-class
  - define-coroutine
  - define-demanding
  - define-global
  - define-parameter
  - define-syntax
  - define-values
  - delq
  - dict-each
  - dyn-wind
  - dyn-with
  - each
  - for-each
  - function-compose
  - globals
  - if
  - import
  - import-from
  - lambda
  - let
  - let*
  - let-values
  - let/cc
  - letrec
  - list-each
  - locals
  - macro-match
  - macro-rules
  - or
  - special-match
  - special-rules
  - parameterq
  - parameterize
  - raise
  - ref
  - refq
  - reset
  - return
  - set!
  - setq
  - setq-values
  - shift
  - syntax-match
  - syntax-rules
  - try
  - unless
  - when
  - when-main
  - while
  - with
  - yield
  - yield-from


# The end.
