version: 1

# Layout block heads (specialty-defined layouts) that appear as `NAME:` at the
# start of a line. Peer heads are listed separately under layout_peers.
layout_heads:
  - if
  - try
  - begin
  - define
  - when
  - when-main
  - class
  - for-each
  - while
  - dyn-wind
  - with
  - dyn-with
  - define-syntax
  - syntax-rules

# Peer block heads for layouts that declare peers. These are not necessarily
# special forms, but they do appear as `NAME:` block headers.
layout_peers:
  if:
    - elif
    - else
  try:
    - except
    - else
    - finally

# Literal constants reserved for future editor highlighting. The first
# iteration keeps these in the spec but does not wire them into grammars yet.
constants:
  - True
  - False
  - None
  - nil

# Paren-list first-symbol tokens to highlight as keyword.control (TextMate),
# keyword.control (Helix), and font-lock-keyword-face (Emacs). One ordered list
# for all three; adjust order here if you care about alternation precedence.
#
# TextMate: editors/textmate/syntaxes/koskari.tmLanguage.json duplicates this
# word set in #list-head-special and #bare-line-call-head (same alternation);
# keep those patterns aligned when adding or renaming entries here.
list_head_specials:
  - and
  - attr
  - begin
  - bind!
  - bindq
  - break
  - call/cc
  - capture/cc
  - class
  - cond
  - continue
  - define-coroutine
  - define-syntax
  - define
  - delq
  - dyn-wind
  - dyn-with
  - for-each
  - if
  - import-from
  - import
  - lambda
  - let
  - let/cc
  - None?
  - or
  - parameterq
  - parameterize
  - raise
  - refq
  - ref
  - reset
  - set!
  - setq
  - shift
  - try
  - unless
  - use-parameter
  - when
  - when-main
  - while
  - with

# The end.
