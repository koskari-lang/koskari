# cibuildwheel settings for the Pyodide wheel, read by the build-pyodide
# job in build_wheel.yml and by the pyodide tox environment, so a local
# build takes the same path as a published one. The native wheels do not
# read this file.
#
# pyodide-version moves with the Pyodide CDN URL on koskari.org.

[tool.cibuildwheel]
pyodide-version = "314.0.7"
test-extras = ["repl", "lsp", "pygments", "sphinx"]
test-requires = ["pytest", "PyYAML", "jsonschema", "setuptools"]
test-command = "python -m pytest {project}/tests"

# The end.
