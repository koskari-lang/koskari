id: itertools-takewhile-koskari-predicate-001
feature: module/koskari.itertools
source: |-
  (begin
    (import-from koskari.itertools takewhile)
    (list (takewhile (lambda [x] (< x 3)) (#list 1 2 3 4 1))))
verify:
  eval: "list:[1,2]"
references:
  - reference/runtime/koskari-itertools.md
stability: evolving
tags:
  - module
  - itertools
  - takewhile
  - eval
notes: >-
  koskari.itertools takes a koskari callable directly; python's
  itertools does not (see itertools-invalid.yaml)
---
id: itertools-dropwhile-retires-predicate-001
feature: module/koskari.itertools
source: |-
  (begin
    (import-from koskari.itertools dropwhile)
    (list (dropwhile (lambda [x] (< x 3)) (#list 1 2 3 4 1 2))))
verify:
  eval: "list:[3,4,1,2]"
references:
  - reference/runtime/koskari-itertools.md
stability: evolving
tags:
  - module
  - itertools
  - dropwhile
  - eval
notes: >-
  the predicate is retired after its first rejection, so the trailing
  1 and 2 are yielded although they satisfy it
---
id: itertools-accumulate-initial-001
feature: module/koskari.itertools
source: |-
  (begin
    (import-from koskari.itertools accumulate)
    (list (accumulate (#list 1 2 3) initial: 10)))
verify:
  eval: "list:[10,11,13,16]"
references:
  - reference/runtime/koskari-itertools.md
stability: evolving
tags:
  - module
  - itertools
  - accumulate
  - eval
notes: >-
  the seed is emitted before the source is read, so four values come
  from three elements
