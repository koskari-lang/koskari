id: itertools-starmap-unpacks-element-001
feature: module/koskari.itertools
source: |-
  (begin
    (import-from koskari.itertools starmap)
    (list (starmap (lambda [a b] (+ a b)) (#list (#tuple 1 2) (#tuple 3 4)))))
verify:
  eval: "list:[3,7]"
references:
  - reference/runtime/koskari-itertools.md
stability: evolving
tags:
  - module
  - itertools
  - starmap
  - eval
notes: >-
  each element is unpacked as the argument list, unlike map which
  passes it whole
---
id: itertools-groupby-materialized-groups-001
feature: module/koskari.itertools
source: |-
  (begin
    (import-from koskari.itertools groupby)
    (list (each [kv (groupby "AAABB")] (list (item kv 1)))))
verify:
  eval: "list:[[\"A\",\"A\",\"A\"],[\"B\",\"B\"]]"
references:
  - reference/runtime/koskari-itertools.md
stability: evolving
tags:
  - module
  - itertools
  - groupby
  - eval
notes: >-
  groupby yields #(key group) and the group is a list, not a
  shared-cursor view, so it stays valid after the parent advances
