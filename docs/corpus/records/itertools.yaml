id: itertools-batched-short-tail-001
feature: module/koskari.itertools
source: |-
  (begin
    (import-from koskari.itertools batched)
    (list (each [b (batched (#list 0 1 2 3 4 5 6) 3)] (list b))))
verify:
  eval: "list:[[0,1,2],[3,4,5],[6]]"
references:
  - reference/runtime/koskari-itertools.md
stability: evolving
tags:
  - module
  - itertools
  - batched
  - eval
notes: >-
  batches are tuples; converted to lists here so the result encodes.
  The final batch is short when the source does not divide evenly
---
id: itertools-chain-sources-in-turn-001
feature: module/koskari.itertools
source: |-
  (begin
    (import-from koskari.itertools chain)
    (list (chain (#list 1 2) "ab")))
verify:
  eval: "list:[1,2,\"a\",\"b\"]"
references:
  - reference/runtime/koskari-itertools.md
stability: evolving
tags:
  - module
  - itertools
  - chain
  - eval
notes: >-
  each source is acquired only when the one before it runs out
---
