id: module-solve-amb-in-generator-invalid-001
feature: module/koskari.solve
source: |-
  (begin
    (import-from koskari.solve amb solve)
    (solve
      (lambda []
        (define g ((lambda [] (yield (amb (#list 1 2))))))
        (next g))))
verify:
  invalid: "amb inside a generator body cannot reach the search delimiter: the capture is denied at the generator boundary and fails at runtime with KoskariPromptUnreachable. Adding another solve will not help; a shift cannot cross a generator boundary, which is also why lazy one-solution-at-a-time enumeration is a non-goal for koskari.solve. Restructure so the choice point is not inside a generator."
references:
  - reference/runtime/koskari-solve.md
stability: evolving
tags:
  - module
  - solve
  - amb
  - generator
  - invalid
  - pitfall
  - nondeterminism
  - search
notes: "runtime failure at the generator boundary; the delimiter exists but is unreachable, so the corrective differs from the no-delimiter case: restructure, do not add delimiters"
