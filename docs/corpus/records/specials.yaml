id: special-try-named-binding-003
feature: special/compile/try
source: |-
  (try (/ 1 0) ([e ZeroDivisionError] (str e)))
  
verify:
  read: (try (/ 1 0) ((e ZeroDivisionError) (str e)))
  expand: (try (/ 1 0) ((e ZeroDivisionError) (str e)))
  eval: '"division by zero"'
references:
  - reference/specials/compile-try.md
stability: evolving
tags:
  - special
  - try
  - exception
notes: named binding form [e TYPE]; exception message accessed via str
