  - surface:block
  - idiom
notes: a keyword line ending in a colon takes the block beneath it as its value; the forms after the keyword head that block and resolve their own layout, here let. A head whose layout gathers peers (if, try) cannot sit here, see layout-keyword-block-peer-head-invalid-001.
---
id: layout-keyword-block-bare-begin-004
feature: reader/layout
source: |-
  dict:
    a::
      let [[x 1]]:
        + x 2
verify:
  read: "(dict a: (begin (let [[x 1]] (+ x 2))))"
  expand: "(dict a: (begin (let [[x 1]] (+ x 2))))"
  eval: "{\"a\": 3}"
references:
