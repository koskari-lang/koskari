notes: a line under a call header that opens with a keyword is a keyword argument to the header, spliced as the keyword and its value; it is not an implicit call of the keyword. One value form follows the keyword here; see layout-keyword-line-several-values-002 for a longer tail.
---
id: layout-keyword-line-several-values-002
feature: reader/layout
source: |-
  dict:
    a: + 1 2
verify:
  read: "(dict a: (+ 1 2))"
  expand: "(dict a: (+ 1 2))"
  eval: "{\"a\": 3}"
references:
  - reference/reader-layout.md
  - reference/layouts/layout-block-default.md
stability: evolving
tags:
  - layout
  - reader
  - keyword
  - surface:block
  - idiom
notes: "several forms after a keyword on one line fold to a call, the same line rule as everywhere else: a: + 1 2 is a: (+ 1 2)."
---
id: layout-keyword-block-value-head-003
feature: reader/layout
source: |-
  dict:
    a: let [[x 1]]:
      + x 2
verify:
  read: "(dict a: (let [[x 1]] (+ x 2)))"
  expand: "(dict a: (let [[x 1]] (+ x 2)))"
  eval: "{\"a\": 3}"
