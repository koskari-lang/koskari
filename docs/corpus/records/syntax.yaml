notes: "splitting a long value across lines, option 2: end the header with a colon and nest the single value expression as a block -- it reads identically to opening the paren on the header line (see layout-split-value-open-paren-001). Without either, the indented value is a separate child form (see layout-split-value-next-line-invalid-001)."
