id: syntax-macro-rules-introspect-001
feature: special/compile/macro-rules
source: |-
  (define-syntax tag-head
    (macro-rules []
      [(tag-head TAG form)
       (begin
         (define-values [head rest] form.datum)
         `(,head ,TAG ,@rest))]))
  
verify:
  read: (define-syntax tag-head (macro-rules [] [(tag-head TAG form) (begin (define-values [head rest] (attr form datum)) (quasiquote ((unquote head) (unquote TAG) (unquote-splicing rest))))]))
  expand: (define-global compile/tag-head (macro-rules tag-head [] [(tag-head TAG form) (begin (define-values [head rest] (attr form datum)) (quasiquote ((unquote head) (unquote TAG) (unquote-splicing rest))))]))
references:
  - reference/specials/compile-macro-rules.md
stability: evolving
tags:
  - macro
  - macro-rules
  - metaprogramming
notes: |-
  Procedural macro that introspects its matched form: form.datum unwraps the
  matched pair, define-values [head rest] destructures it, and quasiquote with
  unquote-splicing rebuilds a form with TAG injected after the head. Used:
  (tag-head 0 (+ 1 2)) -> (+ 0 1 2). A macro and its use must be in separate
  compilation units, so this record verifies the definition, not a call.
  
