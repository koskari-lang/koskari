id: syntax-macro-rules-introspect-001
feature: special/compile/macro-rules
source: |-
  (syntax tag-head
    (macro-rules []
      [(tag-head TAG form)
       (begin
         (var [head rest] form.datum)
         (datum `(,head ,TAG.datum ,@rest)))]))
  
verify:
  read: (syntax tag-head (macro-rules [] [(tag-head TAG form) (begin (var [head rest] (attr form datum)) (datum (quasiquote ((unquote head) (unquote (attr TAG datum)) (unquote-splicing rest)))))]))
  expand: (syntax tag-head (macro-rules [] [(tag-head TAG form) (begin (var [head rest] (attr form datum)) (datum (quasiquote ((unquote head) (unquote (attr TAG datum)) (unquote-splicing rest)))))]))
references:
  - reference/specials/compile-macro-rules.md
stability: evolving
tags:
  - macro
  - macro-rules
  - metaprogramming
notes: |-
  Procedural macro that introspects its matched form: form.datum unwraps the
  matched pair, var [head rest] destructures it, and quasiquote with
  unquote-splicing rebuilds a form with TAG injected after the head. Used:
  (tag-head 0 (+ 1 2)) -> (+ 0 1 2). The rebuilt form is the caller's code,
  so it goes back out inside datum; a piece taken out with .datum and
  emitted bare would be marked as the macro's own. A macro and its use must
  be in separate compilation units, so this record verifies the definition,
  not a call.
  
