id: match-bare-multitoken-001
feature: special/compile/match
source: |-
  (match seq [[a b c] "seq?"] [else: 0])
  
verify:
  error: "SpecialError: invalid case pattern"
references:
  - reference/specials/compile-match.md
  - reference/concepts/match-patterns.md
stability: evolving
tags:
  - match
  - sequence
  - invalid
notes: "corrective: a sequence is always the explicit form -- (match seq [[#[a b c]] ...] ...)"
