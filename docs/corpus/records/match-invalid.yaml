id: match-spine-dcolon-surprising-001
feature: special/compile/match
source: |-
  (match seq [[#[a :: int]] "typed?"] [else: "fell-through"])
  
verify:
  read: "(match seq [[(#list a :: int)] \"typed?\"] [else: \"fell-through\"])"
  invalid: "surprising: a bare :: inside a sequence is not a type marker -- #[a :: int] is a THREE-element sequence (capture a, literal :: keyword, capture int), so seq=(1,2,3) falls through to else; no error is raised"
references:
  - reference/specials/compile-match.md
  - reference/concepts/match-patterns.md
stability: evolving
tags:
  - match
  - sequence
  - typed
  - invalid
  - surprising
  - pitfall
notes: "corrective: parenthesize typed elements inside sequences -- #[(a :: int)]"
---
id: match-string-seq-surprising-001
feature: special/compile/match
source: |-
  (match "ab" [[#[a b]] "chars"] [else: "atom"])
  
verify:
  read: "(match \"ab\" [[(#list a b)] \"chars\"] [else: \"atom\"])"
  invalid: "surprising for Python sequence intuitions elsewhere: a two-character string does NOT destructure into characters -- strings are atoms to sequence patterns (PEP 634), so this falls to else"
references:
  - reference/specials/compile-match.md
  - reference/concepts/match-patterns.md
stability: evolving
tags:
  - match
  - sequence
  - invalid
  - surprising
  - pitfall
notes: "corrective: match a string as a whole value -- [[s :: str] ...] or a literal arm"
