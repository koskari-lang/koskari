id: itertools-map-filter-zip-not-in-module-001
feature: module/koskari.itertools
source: |-
  (begin
    (import-from koskari.itertools map)
    (list (map (lambda [x] (* x 2)) (#list 1 2 3))))
verify:
  invalid: >-
    map, filter and zip are not in koskari.itertools. They are bound
    bare in the builtins namespace and are already native, so this
    import raises ImportError. Call map directly with no import at
    all; python's remain reachable as py-map, py-filter and py-zip.
references:
  - reference/runtime/koskari-itertools.md
  - reference/runtime/map-and-filter.md
stability: evolving
tags:
  - module
  - itertools
  - map
  - invalid
  - pitfall
