id: itertools-python-filterfalse-koskari-predicate-001
feature: module/koskari.itertools
source: |-
  (begin
    (import-from itertools filterfalse)
    (list (filterfalse (lambda [x] (% x 2)) (#list 1 2 3 4))))
verify:
  eval: "list:[]"
  warning: "RuntimeWarning: coroutine '<lambda>' was never awaited"
  invalid: >-
    the same boundary problem inverted. python's filterfalse keeps
    what its predicate rejects, and a koskari lambda hands it a truthy
    coroutine every time, so nothing is kept and the result is empty
    rather than [2, 4]. Import filterfalse from koskari.itertools.
references:
  - reference/runtime/koskari-itertools.md
stability: evolving
tags:
  - module
  - itertools
  - filterfalse
  - invalid
  - surprising
  - pitfall
