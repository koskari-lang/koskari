id: itertools-python-takewhile-koskari-predicate-001
feature: module/koskari.itertools
source: |-
  (begin
    (import-from itertools takewhile)
    (list (takewhile (lambda [x] (< x 3)) (#list 1 2 3 4 1))))
verify:
  eval: "list:[1,2,3,4,1]"
  warning: "RuntimeWarning: coroutine '<lambda>' was never awaited"
  invalid: >-
    python's itertools calls the predicate through the python calling
    convention, where a koskari lambda returns a coroutine rather than
    a verdict. Coroutines are truthy, so every element passes and the
    run never ends: the result is the whole source, with no error
    raised and nothing in a traceback to point at it. Import takewhile
    from koskari.itertools instead, which runs the predicate in the
    evaluator and yields [1, 2]. Wrapping the lambda in demand also
    restores the verdict, but forces every call to run to completion,
    so the predicate can no longer suspend.
references:
  - reference/runtime/koskari-itertools.md
stability: evolving
tags:
  - module
  - itertools
  - takewhile
  - invalid
  - surprising
  - pitfall
notes: >-
  the silent half of the boundary problem; compare
  itertools-takewhile-koskari-predicate-001
