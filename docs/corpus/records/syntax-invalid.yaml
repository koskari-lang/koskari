id: reader-f-string-conversion-suffix-invalid-001
feature: reader/f-string
source: f"{42!r}"
verify:
  read: "(#str (format 42!r))"
  invalid: Koskari has no Python conversion suffix. !r is consumed as part of the atom 42!r, so eval looks up that name and fails with NameError. The same happens for !s, !a, and the debug suffix z=.
references:
  - reference/grammar.md
  - reference/specials/compile-format.md
stability: evolving
tags:
  - reader
  - f-string
  - invalid
  - surprising
  - pitfall
notes: "corrective: wrap the expression, f\"{(repr 42)}\" or f\"{(str 42)}\". see reader-f-string-repr-slot-021"
