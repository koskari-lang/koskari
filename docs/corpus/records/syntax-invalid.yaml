id: reader-dot-attr-chained-call-invalid-001
feature: reader/dot-attr
source: |-
  (begin (var x "  AB  ") (x.strip.lower))
  
verify:
  read: (begin (var x "  AB  ") ((attr (attr x strip) lower)))
  invalid: "a dot with no enclosing parens is an attribute read, never a call; x.strip.lower reads as (attr (attr x strip) lower), an attribute lookup for 'lower' on the unbound strip method object, and fails at runtime with AttributeError: 'builtin_function_or_method' object has no attribute 'lower'"
references:
  - reference/grammar.md
  - guide/brackets-and-call-convention.md
stability: evolving
tags:
  - object
  - dot-attr
  - python-interop
  - invalid
  - pitfall
notes: "corrective: (begin (var x \"  AB  \") ((x.strip).lower))"
