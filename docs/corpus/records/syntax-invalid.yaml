id: layout-syntax-rules-inline-case-invalid-001
feature: layout/define-syntax
source: |-
  define-syntax dbl:
      syntax-rules []:
          case (dbl x): (+ x x)
verify:
  error: "LayoutError: rule must be a block"
references:
  - reference/macros/compile-define-syntax.md
  - reference/layouts/index.md
stability: evolving
tags:
  - layout
  - define-syntax
  - syntax-rules
  - "surface:block"
  - invalid
  - pitfall
  - metaprogramming
notes: "a case body must be an indented block, not inline after the colon. corrective: put the template on the next indented line -- case (dbl x): then (+ x x) indented under it."
---
id: syntax-macro-define-and-use-same-unit-invalid-001
feature: macro/compile/define-syntax
source: |-
  (begin
    (define-syntax twice (macro-rules [] [(twice x) `(+ ,x ,x)]))
    (twice 21))
verify:
  read: (begin (define-syntax twice (macro-rules [] [(twice x) (compile/quasiquote (+ (compile/unquote x) (compile/unquote x)))])) (twice 21))
  invalid: "a macro and a use of it cannot share a compilation unit. define-syntax registers twice, but inside the same begin (twice 21) is compiled before that registration is visible, so twice is treated as a runtime value and eval fails with TypeError: 'Syntax' object is not callable. Read and expand succeed; only eval fails."
references:
  - reference/macros/compile-define-syntax.md
stability: evolving
tags:
  - macro
  - define-syntax
  - macro-rules
  - metaprogramming
  - invalid
  - pitfall
notes: "corrective: define the macro in its own module or an earlier top-level unit, then use it from a later one -- the macro must be registered before the unit that calls it is compiled."
---
id: layout-split-value-next-line-invalid-001
feature: reader/layout
source: |-
  define-values [a b]
      (values 1 2)
  
verify:
  read: (compile/begin (define-values [a b]) (values 1 2))
  invalid: "in layout, a bare indented line under a header is a CHILD form, not a continuation of the header -- the value becomes a separate expression, leaving define-values with no value: SyntaxMatchError (no matching syntax rule) at compile. To split just the value, either open its parenthesis on the header line and continue inside it, or end the header with a colon and nest the single value expression as a block."
stability: evolving
tags:
  - layout
  - reader
  - "surface:block"
  - invalid
  - pitfall
notes: "corrective (either): `define-values [a b] (values` + newline + indented `1 2)`; or `define-values [a b]:` + newline + indented `values 1 2`. Sibling of layout-bare-multiline-define-invalid-001."
---
id: reader-dot-attr-python-call-parens-invalid-001
feature: reader/dot-attr
source: |-
  (define d (dict a: 1))
  (d.keys())
  
verify:
  read: "(compile/begin (define d (dict a: 1)) ((compile/attr d keys) ()))"
  invalid: "python call syntax does not carry over. the dot reads the attribute and the ENCLOSING parens are the call, so d.keys() is not a no-argument call -- the trailing () is a second, empty list passed as an argument, giving ((compile/attr d keys) ()) and TypeError: dict.keys() takes no arguments (1 given). the same mistake is silent when the method tolerates an argument."
references:
  - reference/specials/compile-call-attr.md
stability: evolving
tags:
  - reader
  - dot-attr
  - "pragma:reader/dot-attrs"
  - invalid
  - surprising
  - pitfall
notes: "corrective: (d.keys) -- parens go around the whole form, never after the attribute. for a nested call write (sorted (d.keys)), not (sorted d.keys())"
---
id: reader-dot-attr-space-breaks-invalid-002
feature: reader/dot-attr
source: |-
  ("hello" .upper)
  
verify:
  read: ("hello" .upper)
  invalid: "the suffix must touch the value. with a space, .upper is an ordinary symbol and this reads as calling the string \"hello\" with that symbol as an argument, failing at eval with NameError: Empty reference: .upper. nothing about the receiver is wrong here -- only the space."
references:
  - reference/specials/compile-call-attr.md
stability: evolving
tags:
  - reader
  - dot-attr
  - "pragma:reader/dot-attrs"
  - invalid
  - surprising
  - pitfall
notes: "corrective: (\"hello\".upper) with no space, or the leading-dot spelling (.upper \"hello\") where the symbol is in head position"
---
id: reader-dot-attr-trailing-dot-invalid-003
feature: reader/dot-attr
source: |-
  obj.
  
verify:
