id: reader-string-segment-space-breaks-invalid-006
feature: reader/string-segment
source: |-
  "a" - " b"
  
verify:
  read: (compile/begin "a" - " b")
  invalid: the marker must touch the closing quote. with a space this is three separate forms -- two strings and the subtraction symbol -- which at top level evaluates to the last of them, " b", instead of joining anything. it fails silently rather than erroring, so the wrong result is easy to miss.
references:
  - reference/grammar.md
stability: evolving
tags:
  - reader
  - string-segment
  - "pragma:reader/string-segments"
  - invalid
  - surprising
  - pitfall
notes: "corrective: \"a\"- \" b\" -- adjacent to the quote. the gap AFTER the marker may be any whitespace, including newlines; only the marker itself must be attached"
---
id: reader-string-segment-non-literal-invalid-007
feature: reader/string-segment
source: |-
  "a"- 5
  
verify:
  error: "ReaderSyntaxError: string segment expected after '-'"
references:
  - reference/grammar.md
stability: evolving
tags:
  - reader
  - string-segment
  - "pragma:reader/string-segments"
  - invalid
notes: "corrective: join expressions with (#str \"a\" 5) instead. segments are string literals only, and the marker is a commitment -- once written, a literal must follow"
