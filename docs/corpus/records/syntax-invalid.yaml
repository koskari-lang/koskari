verify:
  read: (begin seq [0])
  invalid: "the group must touch the value. with a space this is two separate forms, a symbol and a one-element bracket list, not an item access -- and because a bracket list is value-equal to a paren form it goes on to fail at eval with TypeError: 'int' object is not callable rather than reporting anything about indexing."
references:
  - reference/grammar.md
stability: evolving
tags:
  - reader
  - index-bracket
  - "pragma:reader/index-brackets"
  - invalid
  - surprising
  - pitfall
notes: "corrective: seq[0] with no space; fixture seq is (1, 2, 3)"
