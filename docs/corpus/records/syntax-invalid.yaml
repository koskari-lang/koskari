verify:
  read: "(#str (format 42 \"{w}\"))"
  invalid: "curly braces inside a colon spec are literal text, not a nested interpolation. Python's f'{x:{w}}' does not carry over; the spec is the raw string '{w}', which is not a valid int format and fails at compile with ValueError."
references:
  - reference/grammar.md
  - reference/specials/compile-format.md
stability: evolving
tags:
  - reader
  - f-string
  - invalid
  - surprising
  - pitfall
notes: "corrective: bind a spec string and use the two-expression slot, (begin (var rules \"04d\") f\"{42 rules}\"). see reader-f-string-legacy-dynamic-spec-011"
