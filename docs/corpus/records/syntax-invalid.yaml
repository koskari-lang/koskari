source: |-
  dict:
    a: if True:
      1
    else:
      2
verify:
  error: "LayoutError: a: value block headed by if cannot gather its peers here; write a:: and nest the if block"
references:
  - reference/reader-layout.md
  - reference/layouts/layout-block-default.md
stability: evolving
tags:
  - layout
  - reader
  - keyword
  - surface:block
  - invalid
  - pitfall
notes: "corrective: a:: on its own line, then the if block indented beneath it, which reads as a: (begin (cond ...)). Peers such as else pair only with a block head that starts its line, so a peer-gathering head cannot follow a keyword on the same header line."
