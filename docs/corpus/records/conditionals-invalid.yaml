id: conditional-layout-if-mixed-inline-else-001
feature: layout/if
source: |-
  if (< n 1) a
  else:
    b
verify:
  read: (begin (if (< n 1) a) (else b))
  invalid: "surprising layout: line-mode if completes as (if (< n 1) a); else: is not an if peer — reads as (else (begin b)), a call to unbound else, not conditional fallthrough; no LayoutError, runtime error if else is undefined"
references:
  - reference/layouts/layout-if.md
  - reference/concepts/layout-and-s-expressions.md
stability: evolving
tags:
  - conditional
  - if
  - "surface:line"
  - "surface:block"
  - invalid
  - surprising
notes: "Looks like if/else layout; actually two expressions. Use block if: … else: … on one construct."
---
id: conditional-layout-if-mixed-inline-elif-001
feature: layout/if
source: |-
  if (< n 1) a
  elif (== n 1):
    b
verify:
  read: (begin (if (< n 1) a) (elif (== n 1) b))
  invalid: "surprising layout: line-mode if completes first; elif: is not an if peer — reads as (elif (== n 1) (begin b)), a call to unbound elif; no LayoutError, runtime error if elif is undefined"
references:
  - reference/layouts/layout-if.md
  - reference/concepts/layout-and-s-expressions.md
stability: evolving
tags:
  - conditional
  - if
  - elif
  - "surface:line"
  - "surface:block"
  - invalid
  - surprising
  - branch
  - pitfall
notes: "Same trap as mixed inline else; elif is only special as declared peer after block if:"
