id: conditional-layout-switch-with-peers-001
feature: layout/switch
source: |-
  switch x:
    case [1]:
      "one"
  else:
    "other"
verify:
  read: (begin (switch x ([1] "one")) (else "other"))
  invalid: "surprising layout: else: at switch indent is not a switch peer or inner clause; switch reads without else arm, then else: is separate (else (begin \"other\")) call to unbound else; no LayoutError — put else: inside switch body"
references:
  - reference/layouts/layout-switch.md
  - reference/concepts/layout-and-s-expressions.md
stability: evolving
tags:
  - conditional
  - switch
  - "surface:block"
  - invalid
  - surprising
  - branch
  - multi-way
  - pitfall
notes: Looks like switch/else; actually switch plus standalone else call block
