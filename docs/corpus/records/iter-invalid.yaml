id: iter-sort-key-koskari-lambda-invalid-001
feature: builtin/demand
source: |-
  (begin
    (var rows #[#{"k": 2} #{"k": 1}])
    (rows.sort key: {(item %1 "k")})
    rows)
  
verify:
  read: "(begin (var rows (#list (#dict (#tuple \"k\" 2)) (#dict (#tuple \"k\" 1)))) ((attr rows sort) key: (gensym-thunk (item %1 \"k\"))) rows)"
  invalid: "list.sort is a python method: it calls the key from python, so a bare koskari lambda returns an un-awaited Coroutine per element and the sort raises TypeError: '<' not supported between instances of 'koskari.lib.Coroutine' and 'koskari.lib.Coroutine'. sorted tolerates the same lambda because it demand-wraps its key; list.sort does not."
references:
  - agents/pitfalls.md
  - agents/native-builtins.md
stability: evolving
tags:
  - iter
  - sort
  - demand
  - higher-order
  - invalid
  - pitfall
notes: "corrective: (rows.sort key: (itemgetter \"k\")) -- itemgetter is a builtin, no import; or wrap the lambda: (rows.sort key: (demand {(item %1 \"k\")})). The same applies to min, max, py-map, py-filter and every other python higher-order function."
