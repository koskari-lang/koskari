id: iter-comma-bracket-list-invalid-001
feature: reader/bracket
source: |-
  [1, 2, 3]
  
verify:
  read: (1, 2, 3)
  invalid: "agent mistake: commas in square brackets are not separators in Koskari — each comma is a character in the following atom name, producing symbols like 2, and 3 rather than integers 2 and 3. Use #[1 2 3] for a list literal or (cons 1 2 3 nil) for a proper pair list"
references:
  - reference/grammar.md
stability: evolving
tags:
  - iter
  - reader
  - invalid
  - surprising
notes: "corrective: #[1 2 3] (list literal) or (cons 1 2 3 nil)"
