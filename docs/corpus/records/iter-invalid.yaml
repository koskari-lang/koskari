id: iter-tuple-builtin-miscall-invalid-001
feature: builtin/tuple
source: |-
  (tuple 1 2 3)
  
verify:
  read: (tuple 1 2 3)
  invalid: "agent mistake: (tuple 1 2 3) calls the Python `tuple` builtin, which is a one-argument conversion — tuple(iterable) — so three arguments raise TypeError: tuple expected at most 1 argument, got 3. `tuple` is not the tuple-literal constructor. To build a tuple of several elements use the literal form #(1 2 3) or (#tuple 1 2 3). (tuple X) is valid only to convert a single iterable X into a tuple."
references:
  - tutorials/from-python/data-and-control.md
  - reference/grammar.md
stability: evolving
tags:
  - iter
  - literal
  - invalid
  - pitfall
  - construct
notes: "corrective: #(1 2 3) or (#tuple 1 2 3)"
