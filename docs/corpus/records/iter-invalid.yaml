id: iter-list-builtin-miscall-invalid-001
feature: builtin/list
source: |-
  (list 1 2 3)
  
verify:
  read: (list 1 2 3)
  invalid: "agent mistake: (list 1 2 3) calls the Python `list` builtin, which is a one-argument conversion — list(iterable) — so three arguments raise TypeError: list expected at most 1 argument, got 3. `list` is not the list-literal constructor. To build a list of several elements use the literal form #[1 2 3] or (#list 1 2 3). (list X) is valid only to convert a single iterable X into a list."
references:
  - tutorials/from-python/data-and-control.md
  - reference/grammar.md
stability: evolving
tags:
  - iter
  - literal
  - invalid
  - pitfall
  - construct
notes: "corrective: #[1 2 3] or (#list 1 2 3)"
