id: iter-list-splat-vs-element-invalid-001
feature: "reader/#list"
source: |-
  (#list seq)
  
verify:
  read: "(#list seq)"
  invalid: "agent mistake: (#list seq) builds a one-element list whose single element is seq itself (here [(1, 2, 3)]), not a list of seq's items. To splice an existing sequence's elements into a list literal, prefix it with *: as in (#list *: seq) or #[*: seq]. The same applies to #(...) tuples."
references:
  - tutorials/from-python/data-and-control.md
  - reference/grammar.md
stability: evolving
tags:
  - iter
  - literal
  - invalid
  - surprising
  - pitfall
  - construct
notes: "corrective: (#list *: seq)"
