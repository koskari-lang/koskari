id: iter-dict-each-positional-pair-001
feature: macro/compile/dict-each
source: (dict-each [i (range 3)] (#str "k" i) (* i 10))
verify:
  invalid: "Use explicit key: and value: clauses for dict-each when key and value expressions are separate. The positional form has one body expression that must itself produce key/value pairs."
references:
  - reference/layouts/layout-for-each.md
stability: evolving
