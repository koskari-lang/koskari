id: iter-comma-list-literal-invalid-002
feature: "reader/#list"
source: |-
  #[1, 2, 3]
  
verify:
  read: "(#list 1, 2, 3)"
  invalid: "agent mistake: commas inside #[...] list literals are atom characters, not separators — #[1, 2, 3] reads as (#list 1, 2, 3) where 1, is the symbol with a comma, not the integer 1. Use #[1 2 3] with plain whitespace separation"
references:
  - reference/grammar.md
stability: evolving
tags:
  - iter
  - reader
  - invalid
  - surprising
  - pitfall
notes: "corrective: #[1 2 3]"
