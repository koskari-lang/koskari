id: iter-python-style-async-for-invalid-001
feature: macro/compile/for-each
source: |-
  (await (for-each [x seq] x))
  
verify:
  eval: "3"
  invalid: "agent mistake: wrapping for-each in await is redundant — for-each handles async iterables automatically via the ambient async evaluator. The result 3 is correct by coincidence, not by design. Canonical form: (for-each [x seq] x) with no await wrapper"
references:
  - reference/specials/compile-for-each.md
stability: evolving
tags:
  - iter
  - for-each
  - invalid
  - surprising
  - iterate
  - loop
  - pitfall
notes: "corrective: (for-each [x seq] x); await wrapping is unnecessary and misleading"
