id: iter-literal-dict-keyword-keys-eval-invalid-001
feature: "reader/#dict"
source: |-
  #{ok: True}
  
verify:
  read: "(#dict (#tuple ok True))"
  invalid: "a keyword key `ok:` lowers to the NAME EXPRESSION `ok`, not the string \"ok\" -- eval raises NameError: Empty reference: ok unless a binding named ok happens to exist, and then its VALUE (whatever it is) becomes the key. Keys are ordinary expressions: quote them."
stability: evolving
tags:
  - iter
  - reader
  - literal
  - dict
  - invalid
  - surprising
  - pitfall
notes: "corrective: #{\"ok\": True}. The payload-dict idiom is quoted string keys throughout: #{\"ok\": True \"msg\": \"pong\"}."
---
id: iter-tuple-vs-list-startswith-invalid-001
feature: "reader/#tuple"
source: |-
  ("abc".startswith #["a" "b"])
  
verify:
  read: "((attr \"abc\" startswith) (#list \"a\" \"b\"))"
  invalid: "str.startswith requires a tuple of prefixes, not a list; #[...] and #(...) read with the same grammar but build different runtime types, and the list form fails at runtime with TypeError: startswith first arg must be str or a tuple of str, not list"
references:
  - reference/grammar.md
stability: evolving
tags:
  - iter
  - tuple
  - python-interop
  - invalid
  - pitfall
notes: "corrective: (\"abc\".startswith #(\"a\" \"b\"))"
