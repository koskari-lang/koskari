id: iter-each-filter-after-body-001
feature: macro/compile/each
source: (each [i (range 6)] i when: (== (% i 2) 0))
verify:
  invalid: "each filter clauses are part of the pattern before the body: (each [i seq] when: condition body). Placing when: after the body is not a filtered comprehension."
references:
  - reference/layouts/layout-for-each.md
stability: evolving
tags:
  - iter
  - each
  - comprehension
  - filter
  - invalid
  - "surface:sexpr"
