id: iter-list-each-missing-binding-vector-001
feature: macro/compile/list-each
source: (list-each i (range 4) (* i i))
verify:
  invalid: "list-each takes one binding vector [name sequence] followed by a body; do not split the binding name and sequence into positional arguments. Use (list-each [i (range 4)] (* i i))."
references:
  - reference/layouts/layout-for-each.md
stability: evolving
tags:
  - iter
  - list-each
  - comprehension
  - invalid
  - "surface:sexpr"
