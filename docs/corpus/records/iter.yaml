id: iter-layout-for-each-else-001
feature: layout/for-each
source: |-
  for-each [x seq]:
    x
  else:
    100
  
verify:
  read: "(for-each [x seq] x (else: 100))"
  expand: "(for-each [x seq] x (else: 100))"
  eval: "100"
references:
  - reference/layouts/layout-for-each.md
  - reference/specials/compile-for-each.md
stability: evolving
tags:
  - iter
  - for-each
  - else
  - "surface:block"
  - iterate
  - loop
notes: "for-each supports a trailing else block (Python for/else): the else body runs when the loop completes without break, and its value becomes the result. seq=(1,2,3) fixture."
---
id: iter-layout-for-each-else-break-002
feature: layout/for-each
source: |-
  for-each [x seq]:
    when (== x 2):
      (break)
  else:
    100
  
verify:
  read: "(for-each [x seq] (when (== x 2) (break)) (else: 100))"
  expand: "(for-each [x seq] (when (== x 2) (break)) (else: 100))"
  eval: "null"
references:
  - reference/layouts/layout-for-each.md
  - reference/specials/compile-for-each.md
stability: evolving
tags:
  - iter
  - for-each
  - else
  - break
  - "surface:block"
  - early-exit
  - iterate
  - loop
notes: the for-each else body is skipped when the loop exits via break; here break fires at x==2, so else does not run and the form yields None. seq=(1,2,3) fixture.
