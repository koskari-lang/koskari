feature: macro/compile/for-each
source: |-
  (begin
    (define total 0)
    (for-each [x seq] (setq total (+ total x)))
    total)
  
verify:
  read: (begin (define total 0) (for-each (x seq) (setq total (+ total x))) total)
  expand: (begin (define total 0) (for-each (x seq) (setq total (+ total x))) total)
  eval: "6"
references:
  - reference/specials/compile-for-each.md
stability: stable
tags:
  - iter
  - for-each
  - accumulate
  - iterate
  - loop
notes: for-each with setq accumulator; seq=(1,2,3); 1+2+3=6
---
id: iter-for-each-multi-body-003
