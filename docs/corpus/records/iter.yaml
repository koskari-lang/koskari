feature: macro/compile/dict-each
source: |-
  (dict-each [w #["a" "bb" "ccc"]] when: (& (len w) 1) key: w value: (len w))
  
verify:
  read: "(dict-each [w (#list \"a\" \"bb\" \"ccc\")] when: (& (len w) 1) key: w value: (len w))"
  eval: "{\"a\": 1, \"ccc\": 3}"
references:
  - reference/macros/compile-dict-each.md
stability: evolving
tags:
  - iter
  - dict-each
  - comprehension
  - dict
  - filter
  - iterate
notes: "the when: clause precedes key:/value: and skips entries whose condition is false; unless: is the negated twin. In the body spelling a whole-body (when ...) around the pair filters the same way, as in list-each (see iter-dict-each-tuple-body-003)."
---
id: iter-dict-each-tuple-body-003
feature: macro/compile/dict-each
source: |-
  (dict-each [w #["a" "bb"]] #(w (len w)))
  
verify:
  read: "(dict-each [w (#list \"a\" \"bb\")] (#tuple w (len w)))"
  eval: "{\"a\": 1, \"bb\": 2}"
references:
  - reference/macros/compile-dict-each.md
stability: evolving
tags:
  - iter
  - dict-each
  - comprehension
  - dict
  - construct
  - iterate
notes: "the body spelling: a single body expression must evaluate to a (key value) pair per element, exactly what dict accepts. Equivalent to the key:/value: form in iter-dict-each-key-value-001; prefer that one when the halves are separate expressions."
