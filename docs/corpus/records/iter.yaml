id: iter-membership-in-basic-001
feature: special/compile/in
source: |-
  (in 3 seq)
  
verify:
  read: (in 3 seq)
  expand: (in 3 seq)
  eval: "true"
references:
  - reference/macros/compile-has.md
stability: evolving
tags:
  - iter
  - membership
  - in
notes: membership test; (in ELEMENT COLLECTION) is true when COLLECTION contains ELEMENT; seq=(1,2,3) fixture. Contrast has? which takes (COLLECTION ELEMENT).
