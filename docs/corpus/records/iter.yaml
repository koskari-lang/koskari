---
id: iter-membership-has-basic-001
feature: macro/compile/has?
source: |-
  (has? seq 3)
  
verify:
  read: (has? seq 3)
  expand: (compile/in 3 seq)
  eval: "true"
references:
  - reference/macros/compile-has.md
stability: evolving
tags:
  - iter
  - membership
  - has?
  - predicate
notes: "has? is the collection-first spelling of membership: (has? COLLECTION ELEMENT) expands to (compile/in ELEMENT COLLECTION). Same test as (in 3 seq), reversed argument order. seq=(1,2,3) fixture."
