id: iter-literal-dict-empty-001
feature: "reader/#dict"
source: |-
  #{}
  
verify:
  read: "(#dict)"
  expand: "(#dict)"
  eval: "{}"
references:
  - tutorials/from-python/data-and-control.md
  - reference/grammar.md
stability: stable
tags:
  - iter
  - reader
  - literal
  - dict
  - construct
  - idiom
notes: "the empty dict is the literal #{}; it is the idiom and the fastest spelling. (dict) works but is a call through the builtin. Likewise #[] and #() for an empty list and tuple."
---
id: iter-sort-key-itemgetter-001
feature: builtin/itemgetter
source: |-
  (begin
    (var rows #[#{"k": 2} #{"k": 1}])
    (rows.sort key: (itemgetter "k"))
    rows)
  
verify:
  read: "(begin (var rows (#list (#dict (#tuple \"k\" 2)) (#dict (#tuple \"k\" 1)))) ((attr rows sort) key: (itemgetter \"k\")) rows)"
  eval: "list:[{\"k\":1},{\"k\":2}]"
references:
  - agents/pitfalls.md
  - agents/native-builtins.md
stability: evolving
tags:
  - iter
  - sort
  - itemgetter
  - higher-order
  - index
  - idiom
notes: "itemgetter and attrgetter are bootstrap builtins: no import-from operator is needed. A key built from them is a plain python callable, so it works with list.sort, sorted, min, max and any other python higher-order function. This is the idiom for a sort key; a koskari lambda needs demand there (see iter-sort-key-koskari-lambda-invalid-001)."
---
id: iter-sort-key-demand-lambda-002
feature: builtin/demand
source: |-
  (begin
    (var xs #[3 1 2])
    (xs.sort key: (demand {(- %1)}))
    xs)
  
verify:
  read: "(begin (var xs (#list 3 1 2)) ((attr xs sort) key: (demand (gensym-thunk (- %1)))) xs)"
  eval: "list:[3,2,1]"
references:
  - agents/pitfalls.md
  - guide/demand-async-and-defer.md
stability: evolving
tags:
  - iter
  - sort
  - demand
  - higher-order
  - python-interop
notes: "a koskari lambda as a list.sort key must be demand-wrapped: list.sort is a python method and calls the key from python, where a bare koskari function returns an un-awaited Coroutine. When the key is an item or attribute lookup, itemgetter or attrgetter is simpler (see iter-sort-key-itemgetter-001)."
---
id: iter-sorted-key-koskari-lambda-003
feature: builtin/sorted
source: |-
  (sorted #[#{"k": 2} #{"k": 1}] key: {(item %1 "k")})
  
verify:
  read: "(sorted (#list (#dict (#tuple \"k\" 2)) (#dict (#tuple \"k\" 1))) key: (gensym-thunk (item %1 \"k\")))"
  eval: "list:[{\"k\":1},{\"k\":2}]"
references:
  - agents/pitfalls.md
  - agents/native-builtins.md
stability: evolving
tags:
  - iter
  - sort
  - sorted
  - higher-order
  - surprising
notes: "sorted is the documented exception: koskari's sorted demand-wraps a callable key: itself, so a bare koskari lambda works here. The same lambda handed to list.sort fails (iter-sort-key-koskari-lambda-invalid-001); do not generalise from sorted to other python higher-order functions."
---
id: iter-map-two-sources-005
feature: builtin/map
source: "(list (map + #[1 2 3] #[10 20 30]))"
verify:
  read: (list (map + (#list 1 2 3) (#list 10 20 30)))
  eval: list:[11,22,33]
references:
  - reference/runtime/map-and-filter.md
stability: evolving
tags:
  - iter
  - map
  - higher-order
  - iterate
notes: "map takes one or more iterables: func receives one element from each per step, in the order they are written, and the shortest iterable ends the map, as python's map does. The iterables are stepped left to right, so a spent one stops the step before the ones after it are asked."
