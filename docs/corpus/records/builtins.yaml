source: "(begin (import os) (define-environ KOSKARI_CORPUS_CLEAR \"dev\") (set! KOSKARI_CORPUS_CLEAR \"x\") (var v (take! KOSKARI_CORPUS_CLEAR)) #(v (in? \"KOSKARI_CORPUS_CLEAR\" os.environ) KOSKARI_CORPUS_CLEAR))"
verify:
  read: (begin (import os) (define-environ KOSKARI_CORPUS_CLEAR "dev") (set! KOSKARI_CORPUS_CLEAR "x") (var v (take! KOSKARI_CORPUS_CLEAR)) (#tuple v (in? "KOSKARI_CORPUS_CLEAR" (attr os environ)) KOSKARI_CORPUS_CLEAR))
  expand: (begin (import os) (define-environ KOSKARI_CORPUS_CLEAR "dev") (set! KOSKARI_CORPUS_CLEAR "x") (var v (take! KOSKARI_CORPUS_CLEAR)) (#tuple v (in? "KOSKARI_CORPUS_CLEAR" (attr os environ)) KOSKARI_CORPUS_CLEAR))
  eval: tuple:("x",false,"dev")
references:
  - reference/runtime/functions.md
stability: evolving
tags:
  - builtin
  - environ-ref
  - mutate
  - default-value
  - surface:sexpr
