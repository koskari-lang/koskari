id: module-solve-amb-require-001
feature: module/koskari.solve
source: |-
  (begin
    (import-from koskari.solve amb require solve)
    (solve (lambda []
      (define x (amb (#list 1 2 3)))
      (require (> x 1))
      x)))
verify:
  eval: "list:[2,3]"
references:
  - reference/runtime/koskari-solve.md
stability: evolving
tags:
  - module
  - solve
  - amb
  - require
  - nondeterminism
  - backtracking
  - search
  - pick-from-choices
  - prune-branches
  - idiom
notes: amb chooses; require prunes; solve collects every surviving choice in choice order
