id: module-solve-amb-product-001
feature: module/koskari.solve
source: |-
  (begin
    (import-from koskari.solve amb solve)
    (solve (lambda []
      (+ (amb (#list 1 2)) (amb (#list 10 20))))))
verify:
  eval: "list:[11,21,12,22]"
references:
  - reference/runtime/koskari-solve.md
stability: evolving
tags:
  - module
  - solve
  - amb
  - nondeterminism
  - search
  - cross-product
  - nested-choices
  - combinations
  - idiom
notes: "nested choice points multiply: every choice of the first amb re-runs the rest of the search, so two ambs enumerate the full product"
