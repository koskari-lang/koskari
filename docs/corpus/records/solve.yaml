id: module-solve-first-001
feature: module/koskari.solve
source: |-
  (begin
    (import-from koskari.solve amb require solve-first)
    (solve-first (lambda []
      (define x (amb (#list 1 2 3)))
      (require (> x 1))
      x)))
verify:
  eval: "2"
references:
  - reference/runtime/koskari-solve.md
stability: evolving
tags:
  - module
  - solve
  - solve-first
  - amb
  - require
  - nondeterminism
  - search
  - first-match
  - early-exit
  - idiom
notes: solve-first stops at the first accepted solution; remaining choices are skipped without running. Returns None when every branch fails
