id: object-format-braces-in-spec-invalid-001
feature: special/compile/format
source: "(format 255 \"{:x}\")"
verify:
  read: "(format 255 \"{:x}\")"
  invalid: "compile/format calls Python format(OBJ, RULES). RULES is the spec token itself, so '{:x}' is not a replacement field and is an invalid int format specifier. The same mistake in an f-string would be f\"{255:{:x}}\", not f\"{255:x}\"."
references:
  - reference/specials/compile-format.md
  - reference/specials/object-operators/index.md
stability: evolving
tags:
  - object
  - format
  - invalid
  - pitfall
notes: "corrective: (format 255 \"x\") or f\"{255:x}\". see object-format-hex-003"
---
id: object-build-class-unbound-invalid-001
feature: special/compile/build-class
source: (begin (build-class Box [] (var size 3)) Box)
verify:
  read: (begin (build-class Box [] (var size 3)) Box)
  invalid: "build-class builds a class value and binds nothing; NAME is only the class __name__, so reading Box afterward fails at eval with NameError: No such reference: Box"
references:
  - reference/specials/compile-build-class.md
stability: evolving
tags:
  - object
  - build-class
  - invalid
  - surprising
  - define-type
  - pitfall
notes: "corrective: (var Box (build-class Box [] (var size 3))), or global class Box at the module"
