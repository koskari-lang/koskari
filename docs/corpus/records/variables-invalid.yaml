id: variable-bind-macro-value-001
feature: macro/compile/bind!
source: (begin (bind! y 42) y)
verify:
  invalid: bind! and bindq attach a Ref to a name, not a plain value; (bind! y 42) tries to store 42 in the binding slot instead of binding y to a ref cell
references:
  - reference/macros/compile-bind.md
  - guide/bindings-and-refs.md
stability: evolving
tags:
  - variable
  - macro
  - bind!
  - invalid
notes: "Illegal: use (var y 42) or (setq y 42) after declare to store a value; bind! accepts (item …), (attr …), (dynamic …), (constant …), (memoized …), (parameter …), or another Ref — not a bare literal or computed value"
---
id: variable-byref-value-not-ref-001
feature: special/compile/lambda
source: |-
  (begin (def bump [&n] (set! n (+ n 1))) (bump 5))
  
verify:
  read: (begin (def bump ((ref n)) (set! n (+ n 1))) (bump 5))
  invalid: "the form parses fine, but a by-ref formal binds the caller's Ref as the parameter's storage, so it requires a Ref argument; (bump 5) passes the plain value 5 and fails at call time with TypeError: bump() by-ref formal n requires a Ref, not 5"
references:
  - reference/specials/compile-lambda.md
  - guide/references-and-storage-indirection.md
stability: evolving
tags:
  - variable
  - lambda
  - by-ref
  - invalid
  - pitfall
notes: "corrective: pass a ref, e.g. (bump &v); a by-ref formal refuses a plain value"
---
id: variable-var-function-shorthand-invalid-001
feature: special/compile/var
source: (var f [x] (* x 2))
verify:
  read: (var f [x] (* x 2))
  error: "SyntaxMatchError: no matching syntax rule"
references:
  - reference/specials/compile-var.md
  - reference/macros/compile-def.md
stability: evolving
tags:
  - variable
  - var
  - invalid
  - pitfall
notes: "var takes a name and a value, never formals and a body. corrective: (def f [x] (* x 2))"
---
id: variable-global-var-conflict-invalid-002
feature: special/compile/global
source: (def bad [] (var q 1) (global q 2))
verify:
  error: "CompilerError: 'q' cannot be both local"
references:
  - reference/specials/compile-global.md
stability: evolving
tags:
  - variable
  - global
  - var
  - invalid
  - module-global
notes: "one scope cannot declare a name with var and with global. corrective: (def ok [] (global q 2)) to store at the module, or (def ok [] (var q 1) (set! q 2)) for a local"
---
id: runtime-koskari-vars-no-dict-invalid-001
feature: runtime/koskari-vars
source: (koskari-vars 5)
verify:
  read: (koskari-vars 5)
  invalid: "an int has no __dict__, so koskari-vars raises TypeError: koskari-vars() argument must have __dict__ attribute"
references:
  - reference/runtime/koskari-vars.md
stability: evolving
tags:
  - runtime
  - koskari-vars
  - invalid
notes: "corrective: pass an object that carries a __dict__, such as a class instance, or call (koskari-vars) with no argument for the current namespace"
