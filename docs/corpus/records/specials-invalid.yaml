id: special-raise-too-many-args-invalid-001
feature: special/compile/raise
source: (raise ValueError "a" "b")
verify:
  read: (raise ValueError "a" "b")
  error: too many arguments to raise
references:
  - reference/specials/compile-raise.md
stability: evolving
tags:
  - special
  - raise
  - error
  - invalid
notes: "raise takes at most one argument. corrective: (raise (ValueError \"a b\")) — construct the exception, then raise the single value"
---
id: special-raise-bare-no-context-invalid-001
feature: special/compile/raise
source: (raise)
verify:
  read: (raise)
  invalid: "0-arity (raise) re-raises the currently-active exception. Outside any handler there is nothing to re-raise, so it compiles cleanly but fails at runtime with RuntimeError: No active exception to reraise. Only use (raise) inside a try handler; to raise a fresh exception, write (raise (SomeError \"msg\"))."
references:
  - reference/specials/compile-raise.md
  - reference/specials/compile-try.md
stability: evolving
tags:
  - special
  - raise
  - reraise
  - invalid
  - error-handling
  - pitfall
  - re-raise
notes: "runtime failure (not a compile error); read succeeds. corrective: put (raise) inside a try handler, or raise a new exception value"
---
id: special-return-bare-symbol-invalid-001
feature: special/compile/return
source: (define f (lambda [x] (when x return) 99))
verify:
  read: (define f (lambda [x] (when x return) 99))
  invalid: "return is a call form; the bare symbol return is not a value binding, so this reads and expands cleanly but fails at runtime with NameError: Empty reference: return the moment the branch runs. Write (return) to exit early, or (return value) to return a value."
references:
  - reference/specials/compile-return.md
stability: evolving
tags:
  - special
  - return
  - invalid
  - pitfall
  - early-exit
notes: "runtime failure; read and expand succeed. corrective: (return) -- e.g. (when x (return))"
---
id: special-call-attr-data-attr-invalid-001
feature: special/compile/call-attr
source: |-
  (.count obj)
  
verify:
  read: (.count obj)
  invalid: "the leading-dot form is a METHOD CALL: it reads obj.count (an int) and then CALLS it -> TypeError: 'int' object is not callable at runtime. (obj.count) in parens is the same call and fails the same way. To READ the attribute, write bare dotted access obj.count (which lowers to (attr obj count)); use the explicit (attr EXPR name) form when the object is an expression result rather than a symbol."
stability: evolving
tags:
  - special
  - call-attr
  - attr
  - invalid
  - pitfall
notes: "corrective: obj.count (bare, no parens) -- or (attr obj count), which it lowers to. Baked fixture obj has .count=5. The surface pairs: obj.count / (attr obj count) READ the attribute; (obj.count) / ((attr obj count)) / (.count obj) all CALL it. Classic instance: (.status_code (client.post url)) -- status_code is data, so write (attr (client.post url) status_code)."
