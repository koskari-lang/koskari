id: special-raise-too-many-args-invalid-001
feature: special/compile/raise
source: (raise ValueError "a" "b")
verify:
  read: (raise ValueError "a" "b")
  error: "SyntaxMatchError: no matching syntax rule"
references:
  - reference/specials/compile-raise.md
stability: evolving
tags:
  - special
  - raise
  - error
  - invalid
notes: "raise takes at most one argument. corrective: (raise (ValueError \"a b\")) — construct the exception, then raise the single value"
---
id: special-raise-bare-no-context-invalid-001
feature: special/compile/raise
source: (raise)
verify:
  read: (raise)
  invalid: "0-arity (raise) re-raises the currently-active exception. Outside any handler there is nothing to re-raise, so it compiles cleanly but fails at runtime with RuntimeError: No active exception to reraise. Only use (raise) inside a try handler; to raise a fresh exception, write (raise (SomeError \"msg\"))."
references:
  - reference/specials/compile-raise.md
  - reference/specials/compile-try.md
stability: evolving
tags:
  - special
  - raise
  - reraise
  - invalid
  - error-handling
  - pitfall
  - re-raise
notes: "runtime failure (not a compile error); read succeeds. corrective: put (raise) inside a try handler, or raise a new exception value"
---
id: special-call-attr-data-attr-invalid-001
feature: special/compile/call-attr
source: |-
  (.count obj)
  
verify:
  read: (.count obj)
  invalid: "the leading-dot form is a METHOD CALL: it reads obj.count (an int) and then CALLS it -> TypeError: 'int' object is not callable at runtime. (obj.count) in parens is the same call and fails the same way. To READ the attribute rather than call it, drop the enclosing parens: obj.count. The receiver may be any value, so (get-fn x).count reads an attribute off an expression result too -- the dot is the read and the parens are the call, whatever the receiver is."
stability: evolving
tags:
  - special
  - call-attr
  - attr
  - invalid
  - pitfall
notes: "corrective: obj.count (bare, no parens) -- or (attr obj count), which it lowers to. Baked fixture obj has .count=5. The surface pairs: obj.count / (attr obj count) READ the attribute; (obj.count) / ((attr obj count)) / (.count obj) all CALL it. Classic instance: (.status_code (client.post url)) -- status_code is data, so write (client.post url).status_code."
---
id: special-use-nested-scope-invalid-001
feature: special/compile/use
source: (def f [] (begin (use os.path join) 1))
verify:
  read: (def f [] (begin (use (attr os path) join) 1))
  error: use is only allowed at module level
references:
  - reference/specials/use.md
stability: evolving
tags:
  - special
  - use
  - import
  - invalid
  - scope
notes: "use is module-level only, like import-all-from: inside a nested scope the compile-time facets could not take effect, since the enclosing body is already compiled. corrective: use import-from for runtime values in nested scopes, or move the use to module level"
---
id: special-use-missing-feature-invalid-001
feature: special/compile/use
source: (begin (use os.path nonesuch))
verify:
  read: (begin (use (attr os path) nonesuch))
  invalid: "reads and compiles cleanly, but fails at eval with ImportError: no feature nonesuch (tried nonesuch, compile/nonesuch, layout/nonesuch) -- a stem must resolve at least one facet. A per-facet miss is normal; only a stem with no facets at all is an error"
references:
  - reference/specials/use.md
stability: evolving
tags:
  - special
  - use
  - import
  - invalid
  - error-handling
notes: "runtime failure, not a compile error; the message names every spelling tried. corrective: check the feature name, or name a single facet explicitly if only one exists"
---
id: special-try-multi-body-invalid-001
feature: special/compile/try
source: |-
  (try (/ 1 0) (+ 1 1) [[e ZeroDivisionError] (str e)])
  
verify:
  read: (try (/ 1 0) (+ 1 1) [[e ZeroDivisionError] (str e)])
  error: "SyntaxMatchError: no matching syntax rule"
references:
  - reference/specials/compile-try.md
  - reference/layouts/layout-try.md
stability: evolving
tags:
  - special
  - try
  - exception
  - error
  - invalid
  - catch
  - error-handling
notes: "(try BODY CLAUSE...) takes one body expression; every form after it must be a clause whose head is a bracketed [TYPE], [NAME TYPE] or [TYPE as: NAME] cell, or except:, else:, finally:. A second body form is not a clause, so the form matches no rule. corrective: (try (begin (/ 1 0) (+ 1 1)) [[e ZeroDivisionError] (str e)]) -- or write the layout form, try: with the body lines indented, which wraps them in begin"
---
id: special-try-bare-type-head-invalid-002
feature: special/compile/try
source: |-
  (try (/ 1 0) (ZeroDivisionError 0))
  
verify:
  read: (try (/ 1 0) (ZeroDivisionError 0))
  error: "SyntaxMatchError: no matching syntax rule"
references:
  - reference/specials/compile-try.md
stability: evolving
tags:
  - special
  - try
  - exception
  - error
  - invalid
  - catch
  - error-handling
notes: "a clause head is a bracketed using cell, never a bare type symbol: (ZeroDivisionError 0) has the shape of a call, which is why the special refuses it rather than guess. corrective: (try (/ 1 0) [[ZeroDivisionError] 0])"
