id: class-layout-inheritance-super-002
feature: layout/class
source: |-
  class A []:
    def __init__ [self]:
      (set-attr self a 1)

  class B (A):
    def __init__ [self]:
      (.__init__ (super))
      (set-attr self b 2)

  class C (B):
    def __init__ [self]:
      (.__init__ (super))
      (set-attr self c 3)

  (vars (C))
verify:
  eval: "{\"a\": 1, \"b\": 2, \"c\": 3}"
references:
  - reference/layouts/layout-class.md
  - reference/macros/compile-super.md
  - reference/macros/compile-class.md
stability: evolving
tags:
  - class
  - layout
  - inheritance
  - dunder
  - super
  - define-type
notes: Three levels, each initializer chaining through (super); (super) names the defining class via __class__, so B's initializer reaches A even on a C instance.
