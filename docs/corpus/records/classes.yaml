id: class-layout-init-repr-eq-001
feature: layout/define-class
source: |-
  define-class Vector2 []:
    define __init__ [self x y]:
      (set-attr self x x)
      (set-attr self y y)
    define __repr__ [self]:
      (#str "Vector2(" self.x ", " self.y ")")
    define __eq__ [self other]:
      (and (instance? other Vector2) (== self.x other.x) (== self.y other.y))
verify:
  read: "(compile/define-class Vector2 () (compile/begin (define __init__ [self x y] (set-attr self x x) (set-attr self y y)) (define __repr__ [self] (#str \"Vector2(\" (compile/attr self x) \", \" (compile/attr self y) \")\")) (define __eq__ [self other] (and (instance? other Vector2) (== (compile/attr self x) (compile/attr other x)) (== (compile/attr self y) (compile/attr other y)))))))"
