id: class-layout-init-repr-eq-001
feature: layout/class
source: |-
  class Vector2 []:
    def __init__ [self x y]:
      (set-attr self x x)
      (set-attr self y y)
    def __repr__ [self]:
      (#str "Vector2(" self.x ", " self.y ")")
    def __eq__ [self other]:
      (and (instance? other Vector2) (== self.x other.x) (== self.y other.y))
verify:
  read: "(class Vector2 () (begin (def __init__ [self x y] (set-attr self x x) (set-attr self y y)) (def __repr__ [self] (#str \"Vector2(\" (attr self x) \", \" (attr self y) \")\")) (def __eq__ [self other] (and (instance? other Vector2) (== (attr self x) (attr other x)) (== (attr self y) (attr other y)))))))"
