id: class-layout-init-repr-eq-001
feature: layout/define-class
source: |-
  define-class Vector2 []:
    define __init__ [self x y]:
      (set-attr self x x)
      (set-attr self y y)
    define __repr__ [self]:
      (#str "Vector2(" self.x ", " self.y ")")
    define __eq__ [self other]:
      (and (instance? other Vector2) (== self.x other.x) (== self.y other.y))
verify:
  read: "(define-class Vector2 () (begin (define __init__ [self x y] (set-attr self x x) (set-attr self y y)) (define __repr__ [self] (#str \"Vector2(\" (attr self x) \", \" (attr self y) \")\")) (define __eq__ [self other] (and (instance? other Vector2) (== (attr self x) (attr other x)) (== (attr self y) (attr other y)))))))"
references:
  - reference/layouts/layout-define-class.md
  - reference/macros/compile-define-class.md
  - reference/specials/compile-class.md
  - reference/specials/compile-set-attr.md
