id: builtin-apply-leading-args-001
feature: builtin/apply
source: "(apply cons 1 2 #[nil])"
verify:
  read: (apply cons 1 2 (#list nil))
  invalid: apply takes FUNC, one iterable of positional arguments, and an optional kwargs dict; leading positional arguments raise TypeError
references:
  - agents/native-builtins.md
  - reference/runtime/functions.md
stability: evolving
tags:
  - builtin
  - apply
  - invalid
  - higher-order
  - pitfall
  - surface:sexpr
notes: "corrective: (apply cons #[1 2 nil])"
