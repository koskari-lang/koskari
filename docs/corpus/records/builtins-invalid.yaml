id: builtin-max-koskari-key-unwrapped-001
feature: builtin/max
source: "(max #[\"aa\" \"b\"] key: (lambda [s] (len s)))"
verify:
  read: "(max (#list \"aa\" \"b\") key: (lambda [s] (len s)))"
  invalid: max is Python's own; a Koskari function as its key returns unawaited coroutines, and comparing them raises TypeError
references:
  - agents/native-builtins.md
  - reference/runtime/functions.md
stability: evolving
tags:
  - builtin
  - max
  - invalid
  - higher-order
  - pitfall
  - surface:sexpr
notes: "corrective: (max #[\"aa\" \"b\"] key: (demand (lambda [s] (len s))))"
