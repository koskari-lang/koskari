id: builtin-defer-await-twice-001
feature: builtin/defer
source: (begin (var d (defer (lambda [] 4))) (await d) (await d))
verify:
  read: (begin (var d (defer (lambda [] 4))) (await d) (await d))
  invalid: a defer is single-shot; the second await raises RuntimeError
references:
  - agents/native-builtins.md
  - reference/runtime/functions.md
stability: evolving
tags:
  - builtin
  - defer
  - invalid
  - await
  - pitfall
  - surface:sexpr
notes: "corrective: (begin (var t (create-task (defer (lambda [] 4)))) ...) for a handle awaited more than once"
