id: builtin-cons-splice-pair-chain-001
feature: builtin/cons
source: "(cons 0 *: '(1 2) nil)"
verify:
  read: "(cons 0 *: (quote (1 2)) nil)"
  invalid: "*: over a pair chain splices its car and cdr, not its elements; a pair iterates as two fields"
references:
  - agents/native-builtins.md
  - reference/runtime/functions.md
stability: evolving
tags:
  - builtin
  - surprising
  - construct
  - invalid
  - pitfall
  - surface:sexpr
notes: "corrective: (cons 0 (quote (1 2))); the last argument of cons is the tail"
