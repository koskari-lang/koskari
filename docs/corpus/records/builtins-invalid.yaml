id: builtin-py-filter-koskari-predicate-001
feature: builtin/py-filter
source: "(list (py-filter (lambda [x] False) #[1 2 3]))"
verify:
  read: (list (py-filter (lambda [x] False) (#list 1 2 3)))
  invalid: py-filter is Python filter; a Koskari predicate returns a truthy unawaited coroutine per element, so every element passes
references:
  - agents/native-builtins.md
  - reference/runtime/map-and-filter.md
stability: evolving
tags:
  - builtin
  - surprising
  - filter
  - invalid
  - pitfall
  - surface:sexpr
notes: "corrective: (list (filter (lambda [x] False) #[1 2 3]))"
