id: function-identity-arity-invalid-001
feature: builtin/identity
source: (identity 1 2)
verify:
  read: (identity 1 2)
  invalid: 'identity takes exactly one positional argument; two raise TypeError, "identity() takes exactly one argument (2 given)". It takes no keyword arguments either, so (identity value: 5) raises TypeError, "identity() takes no keyword arguments"'
stability: evolving
tags:
  - function
  - identity
  - invalid
  - pitfall
notes: 'corrective: (identity 1) -- to carry several values through unchanged, pass one container, e.g. (identity #[1 2])'
