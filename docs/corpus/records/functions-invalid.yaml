id: layout-bare-multiline-define-invalid-001
feature: reader/layout
source: |-
  define x
      (+ 1 2)
verify:
  read: (begin (define x) (+ 1 2))
references:
  - reference/grammar.md
  - reference/concepts/layout-and-s-expressions.md
stability: evolving
tags:
  - reader
  - layout
  - "surface:block"
  - invalid
  - surprising
  - pitfall
notes: "a bare (unparenthesized) define or set! does NOT continue onto a more-indented next line: `define x` binds nothing and `(+ 1 2)` reads as a separate statement. corrective: parenthesize the whole form -- (define x (+ 1 2))."
