id: layout-bare-multiline-define-invalid-001
feature: reader/layout
source: |-
  var x
      (+ 1 2)
verify:
  error: "ReaderSyntaxError: unexpected indent"
references:
  - reference/grammar.md
  - reference/reader-layout.md
  - guide/layout-and-s-expressions.md
stability: evolving
tags:
  - reader
  - layout
  - indent
  - "surface:block"
  - invalid
  - pitfall
notes: "a bare (unparenthesized) var or set! does NOT continue onto a more-indented next line: `var x` is complete as (var x), and a top-level line must start at column 0, so the indented `(+ 1 2)` is a reader error under the default reader/indent pragma. corrective: parenthesize the whole form -- (var x (+ 1 2)) -- or end the header with a colon, `var x:` with `+ 1 2` indented beneath it."
