id: function-gensym-thunk-nested-001
feature: special/compile/gensym-thunk
source: (((gensym-thunk (gensym-thunk (+ %1 1))) 7))
verify:
  invalid: nested gensym-thunk body forms are siblings, not call targets; outer (gensym-thunk (gensym-thunk (+ %1 1))) is zero-arg — passing 7 in the same expression is a TypeError (too many positional arguments). Build (gensym-thunk (gensym-thunk (+ %1 1))), call outer with no args, then call inner with 7 in separate steps
references:
  - reference/specials/compile-gensym-partial.md
stability: evolving
tags:
  - function
  - gensym-thunk
  - invalid
  - metaprogramming
  - pitfall
notes: "Illegal: conflates nested thunk install with invoke; see valid build in reference docs and phase_specials nested thunk test"
