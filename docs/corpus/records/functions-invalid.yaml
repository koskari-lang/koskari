id: function-define-pass-body-invalid-001
feature: special/compile/define
source: |-
  define foo []:
      pass
verify:
  read: (define foo [] pass)
  invalid: "no-op trap from Python: pass is a Python statement with no Koskari binding. It reads as a bare symbol, so (define foo [] pass) parses cleanly and even defines foo, but pass is an unbound reference — calling foo raises NameError: Empty reference: pass. Koskari has no pass; write a no-op body as None or a bare (begin)."
references:
  - reference/specials/compile-define.md
  - reference/specials/compile-begin.md
stability: evolving
tags:
  - function
  - define
  - "surface:block"
  - invalid
  - surprising
notes: "agent mistake: Python pass as a no-op function body; corrective: (define foo [] None) or a bare (begin) / begin: body. pass is an unbound name, not a statement."
---
id: functions-bare-multiline-call-kwarg-invalid-001
feature: reader/layout
source: |-
  define run []:
    compile_file src dest
      source_filename: name
    return 0
verify:
  read: "(define run [] (compile_file src dest) (source_filename: name) (return 0))"
  invalid: "agent mistake: a bare (unparenthesized) call does not continue onto a more-indented next line. Here `source_filename: name` is read as its own statement headed by the keyword, not as an argument to compile_file, so the keyword argument is silently dropped. When a call spans lines, wrap it in parentheses. Correct form: (compile_file src dest source_filename: name)"
references:
  - reference/grammar.md
  - reference/concepts/layout-and-s-expressions.md
stability: evolving
tags:
  - functions
  - reader
  - layout
  - invalid
  - surprising
  - "surface:block"
