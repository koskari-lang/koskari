source: (constantly)
verify:
  read: (constantly)
  invalid: 'the constantly constructor requires exactly one argument and raises TypeError, "constantly expected 1 argument, got 0". The strictness is on construction alone; the callable it returns swallows any arguments'
stability: evolving
tags:
  - function
  - constantly
  - invalid
  - pitfall
notes: 'corrective: (constantly None) for a callable that always yields None'
