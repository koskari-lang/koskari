id: function-constantly-keyword-invalid-001
feature: builtin/constantly
source: "(constantly value: 5)"
verify:
  read: "(constantly value: 5)"
  invalid: 'the captured value is positional only; naming it raises TypeError, "constantly() takes no keyword arguments". Keywords at the call site of the resulting callable are accepted and discarded, so ((constantly 5) a: 1 b: 2) is 5'
stability: evolving
tags:
  - function
  - constantly
  - invalid
  - keyword-argument
  - pitfall
notes: 'corrective: (constantly 5)'
