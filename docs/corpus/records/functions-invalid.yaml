id: functions-bare-multiline-call-kwarg-invalid-001
feature: reader/layout
source: |-
  def run []:
    compile_file src dest
      source_filename: name
    return 0
verify:
  error: "ReaderSyntaxError: unexpected indent"
references:
  - reference/grammar.md
  - reference/reader-layout.md
  - guide/layout-and-s-expressions.md
stability: evolving
tags:
  - functions
  - reader
  - layout
  - indent
  - invalid
  - "surface:block"
  - pitfall
notes: "agent mistake: a bare (unparenthesized) call does not continue onto a more-indented next line. The first line of a body sets its indent and every later line must start at that column, so the deeper `source_filename: name` line is a reader error under the default reader/indent pragma. corrective: wrap the call in parentheses, or open a block: `compile_file src dest:` with `source_filename: name` indented beneath it, reading (compile_file src dest source_filename: name)."
