id: function-decorate-parameterize-timing-001
feature: layout/decorate
source: |-
  define-parameter verbose False
  
  @parameterize [[verbose True]]
  def loud? []:
    verbose
  
  (loud?)
  
verify:
  read: (begin (define-parameter verbose False) (decorate ((parameterize [[verbose True]])) (def loud? [] verbose)) (loud?))
  invalid: grafted @parameterize completes at definition time, so the parameter extent spans only the def itself and has already ended before any call; (loud?) reads verbose at call time and returns False, not True
references:
  - guide/decorators.md
  - reference/macros/compile-decorate-subject.md
stability: evolving
tags:
  - function
  - decorate
  - decorate-subject
  - parameterize
  - "surface:block"
  - "pragma:reader/decorators"
  - invalid
  - surprising
  - pitfall
notes: "corrective: @call-parameterize [[verbose True]] enters the extent per invocation, which is almost always what a grafted with/parameterize over a def was trying to say. Requires reader/decorators (baseline on)."
---
id: function-define-percall-state-001
feature: special/compile/define
source: |-
  define [tick]:
    define count 0
    incr! count
    count
  
  #[(tick) (tick)]
  
verify:
  read: "(begin (define [tick] (define count 0) (incr! count) count) (#list (tick) (tick)))"
  invalid: "count is re-defined inside the body on every call, so the state never persists -- both calls return 1, giving list:[1,1] instead of list:[1,2]"
references:
  - reference/specials/compile-define.md
  - guide/decorators.md
stability: evolving
tags:
  - function
  - define
  - "surface:block"
  - invalid
  - surprising
  - pitfall
  - closure
  - mutate
notes: "corrective: hoist the state into a definition-time extent with @let [[count 0]] over the define, which grafts the define as the let body and makes count private persistent state."
---
id: function-identity-arity-invalid-001
feature: builtin/identity
source: (identity 1 2)
verify:
  read: (identity 1 2)
  invalid: 'identity takes exactly one positional argument; two raise TypeError, "identity() takes exactly one argument (2 given)". It takes no keyword arguments either, so (identity value: 5) raises TypeError, "identity() takes no keyword arguments"'
stability: evolving
tags:
  - function
  - identity
  - invalid
  - pitfall
notes: 'corrective: (identity 1) -- to carry several values through unchanged, pass one container, e.g. (identity #[1 2])'
