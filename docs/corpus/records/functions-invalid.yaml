id: function-define-pair-not-unpack-001
feature: special/compile/define
source: "(begin (define [a b] #(1 2)) (a \"ignored\"))"
verify:
  read: (begin (define [a b] (#tuple 1 2)) (a "ignored"))
  eval: tuple:(1,2)
  invalid: "(define [a b] x) is not an unpacking: it defines a function named a with one formal b whose body is x. b is never bound outside a, and a is a function, so calling it with one argument returns the tuple"
references:
  - reference/specials/compile-define.md
  - reference/specials/compile-var.md
stability: evolving
tags:
  - function
  - define
  - invalid
  - surprising
  - pitfall
  - destructure
notes: "corrective: (var [a b] #(1 2)) or (define-values [a b] #(1 2)) to unpack into a and b"
